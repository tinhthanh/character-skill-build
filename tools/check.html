<!doctype html>
<meta charset="utf-8">
<title>đang kiểm…</title>
<!-- Kiểm tra tự động MỌI nhân vật × MỌI động tác. Mở qua tools/serve.py, hoặc chạy tools/check.sh.
     Kết quả là JSON trong thẻ pre#kq; document.title thành PASS hoặc FAIL. -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="../dist/character.iife.js"></script>
<div id="san" style="width:400px;height:470px"></div><div id="san2" style="width:400px;height:330px"></div>
<pre id="kq"></pre>
<script type="module">
const ra = { ok: true, loi: [], nhanVat: {}, banDung: {} };
const hong = (cho, chu) => { ra.ok = false; ra.loi.push(`${cho}: ${chu}`); };
window.addEventListener('error', (e) => hong('page', e.message));
try {
  const L = await import('../runtime/index.js');
  const { RigSVG, RigThu } = L;
  const S = await import('../runtime/schema.js');
  // Thông báo lỗi dùng TÊN CÔNG KHAI: người viết nhân vật khai `headTilt`, không biết `dau` là gì.
  const stateNames = Object.fromEntries([...Object.entries(S.PET_STATE_KEYS), ...Object.entries(S.PERSON_STATE_KEYS)].map(([pub, internal]) => [internal, pub]));
  const publicKey = (key) => stateNames[key] || key;
  const REQUIRED = Object.fromEntries(S.REQUIRED_IDS.map(([pub, internal]) => [internal, pub]));
  // Danh sách nhân vật, chụp TRƯỚC khi các phép thử đăng ký nhân vật tạm. Bỏ `bakedConfigs` ra:
  // bộ số chỉ được nướng vào bản dựng, mã nguồn dạng module không có — so riêng ở dưới.
  const listOf = (lib) => { const { bakedConfigs, ...rest } = lib.list(); return JSON.stringify(rest); };
  const listAtStart = listOf(L);
  const xau = (svg) => { let n = 0; svg.querySelectorAll('*').forEach((el) => { for (const a of el.attributes) if (/NaN|undefined|null|Infinity/.test(a.value)) n++; }); return n; };
  const trungId = (svg) => { const m = {}; svg.querySelectorAll('[id]').forEach((e) => { m[e.id] = (m[e.id] || 0) + 1; }); return Object.keys(m).filter((k) => m[k] > 1); };
  const quet = (rig, ten, dsDongTac, duocLech) => {
    const o = ra.nhanVat[ten] = { dongTac: dsDongTac.length };
    const t0 = trungId(rig.svg); if (t0.length) hong(ten, 'duplicate element ids: ' + t0.join(','));
    if (xau(rig.svg)) hong(ten, 'broken SVG attributes (NaN / undefined) at rest');
    for (const m of dsDongTac) {
      rig.datNghi();
      let t;
      try { t = m === 'point' ? rig.point({ x: 60, y: 80 }) : (m === 'speak' || m === 'explain') ? rig[m]('Xin chào, rất vui được gặp bạn!', 2.4) : rig[m](); }
      catch (e) { hong(`${ten}.${m}`, 'threw while building: ' + e.message); continue; }
      let n = 0;
      for (let i = 0; i <= 60; i++) { t.progress(i / 60); rig.apDung(); n += xau(rig.svg); }
      if (n) hong(`${ten}.${m}`, `${n} NaN/undefined attributes during the action`);
      const lech = Object.keys(rig.NGHI).filter((q) => (typeof rig.NGHI[q] === 'number' ? Math.abs(rig.s[q] - rig.NGHI[q]) > 1e-3 : rig.s[q] !== rig.NGHI[q]));
      if (lech.length && !duocLech.includes(m)) hong(`${ten}.${m}`, 'does not return to the rest pose: ' + lech.map(publicKey).join(', '));
      t.kill();
    }
    // Slot bắt buộc
    for (const id of o.canCo || []) if (!rig.svg.querySelector(`#${rig.id}-${id}`)) hong(ten, `missing element #…-${id}`);
  };
  // Không DỊCH CHUYỂN TỨC THỜI: dựng một chuỗi rồi đi từng khung 1/30 s — không khung nào được
  // nhảy xa. Chạy ĐẦU TIÊN, trên trang còn sạch: lỗi này (tween ghi nhớ sai giá trị đầu do cơ
  // chế lazy của GSAP — nhân vật bước vào xong giật về điểm xuất phát) chỉ lộ ra khi tween
  // được vẽ lần đầu bằng một cú nhảy, đúng tình huống của bộ dựng video.
  for (const [ten, tao, buoc] of [['vet', (h) => new RigSVG(h, 'vet'), ['enter', 'wave', ['walk', 4, 100], 0.3, 'nod']],
                                  ['dog', (h) => new RigThu(h, 'dog'), ['enter', 'wagTail', ['walk', 4, 80], 'sit']]]) {
    const rig = tao(document.getElementById('san')), t = L.sequence(rig, buoc);
    let truoc = null;
    for (let k = 0; k <= Math.ceil(t.duration() * 30); k++) {
      t.totalTime(k / 30, false);
      if (truoc !== null && Math.abs(rig.s.x - truoc) > 16) { hong('sequence', `${ten}: position jumps between two consecutive frames — frame ${k}: x ${truoc.toFixed(0)} → ${rig.s.x.toFixed(0)}`); break; }
      truoc = rig.s.x;
    }
    if (rig.tl().vars.defaults.lazy !== false) hong(ten, 'rig timelines must have defaults.lazy = false');
  }

  for (const k of Object.keys(RigSVG.NHAN_VAT)) {
    const rig = new RigSVG(document.getElementById('san'), k);
    for (const id of ['tocTruoc', 'matL', 'matR', 'nguoiL', 'nguoiR', 'banL', 'banR'])
      if (!rig.svg.querySelector(`#${rig.id}-${id}`)) hong(k, `missing required element id "\${p}-${REQUIRED[id]}" (see references/slots.md)`);
    quet(rig, k, [...RigSVG.DONG_TAC, ...RigSVG.DI_NGANG], ['walkAway', 'exit']);
    // đổi màu + bộ số không được làm hỏng
    try { rig.doiMau({ ao: '#8a5ad6', toc: '#6b4b2f' }); L.applyConfig(rig, { proportions: { headSize: 1.2 }, faceShape: { halfWidth: 44 } }); if (xau(rig.svg)) hong(k, 'broken SVG attributes after setColors / applyConfig'); }
    catch (e) { hong(k, 'setColors / applyConfig threw: ' + e.message); }
  }
  for (const k of Object.keys(RigThu.LOAI)) { const pet = new RigThu(document.getElementById('san2'), k); quet(pet, k, pet.DONG_TAC, ['exit']); }

  // Tính tất định: gieo cùng hạt phải ra cùng timeline.
  { const rig = new RigSVG(document.getElementById('san'), 'vet');
    const dau = (t) => JSON.stringify(t.getChildren(true, true, false).map((c) => [c.startTime().toFixed(3), c.duration().toFixed(3)]));
    L.seed(3); const a = dau(rig.explain('một hai ba bốn', 2)); L.seed(3); const b = dau(rig.explain('một hai ba bốn', 2)); L.seed(null);
    if (a !== b) hong('seed', 'the same seed produced two different timelines'); }

  // sequence(): khung 0 phải đúng trạng thái đầu của bước đầu; tua tới đâu cũng ra đúng một trạng thái.
  { const rig = new RigSVG(document.getElementById('san'), 'surgeon');
    const t = L.sequence(rig, ['enter', 'wave', ['walk', 4, 100], 0.3, 'nod']);
    t.seek(0); rig.apDung(); const x0 = rig.s.x;
    if (Math.abs(x0 + 270) > 2) hong('sequence', `frame 0: x = ${x0.toFixed(1)}, expected −270 (enter)`);
    const chup = (tg) => { t.seek(tg); rig.apDung(); return JSON.stringify(Object.keys(rig.NGHI).map((k) => (typeof rig.s[k] === 'number' ? +rig.s[k].toFixed(3) : rig.s[k]))); };
    const tg = t.duration() * 0.63, a = chup(tg); chup(0.2); chup(t.duration()); const b = chup(tg);
    if (a !== b) hong('sequence', 'seeking to one time by two paths gives two states');
    t.seek(t.duration()); rig.apDung();
    if (Math.abs(rig.s.x - 100) > 1) hong('sequence', `end of sequence: x = ${rig.s.x.toFixed(1)}, expected 100`);
    // Tua bằng seek() — GSAP tắt mọi callback — hình vẫn phải đổi theo (rig tự vẽ lại ở microtask).
    const hinh = () => rig.el.goc.getAttribute('transform') + rig.el.batR.getAttribute('transform');
    t.totalTime(1.0, false); const dung = hinh();
    t.totalTime(3.0, false); t.seek(1.0); await Promise.resolve();
    if (hinh() !== dung) hong('sequence', 'seek() (callbacks suppressed) does not redraw');
    ra.kichBan = { dai: +t.duration().toFixed(2) }; }

  // ── Các lớp CHẶN LỖI IM LẶNG phải còn hoạt động ──
  { const expectThrow = (label, fn) => { try { fn(); hong('guards', `${label}: should have thrown`); } catch (e) { /* đúng */ } };
    const host = document.getElementById('san');
    const problems = L.validateConfig({ proportionz: { headSize: 2 }, faceShape: { halfWidth: 'wide', crownHeight: 50 }, colors: { top: 'green' }, restPose: { upperArmL: 'x' } });
    if (problems.length !== 4) hong('guards', `validateConfig should report 4 problems, reported ${problems.length}: ${problems.join(' | ')}`);
    if (L.validateConfig({ proportions: { headSize: 1.2 }, colors: { top: '#2f9e8f' }, restPose: { smile: 1, handL: 'fist' } }).length) hong('guards', 'validateConfig rejects a valid config');
    if (L.validateConfig({ shape: { legLength: 0.8 }, colors: { fur: '#333333' } }, 'pet').length) hong('guards', 'validateConfig rejects a valid pet config');
    expectThrow('createCharacter with a wrongly typed config', () => L.createCharacter(host, { id: 'surgeon', config: { faceShape: { halfWidth: 'wide' } } }));
    expectThrow('createPet with an unknown species', () => L.createPet(host, { species: 'rabbit' }));
    expectThrow('setColors with a colour name', () => new RigSVG(host, 'default').setColors({ top: 'red' }));
    expectThrow('registering a duplicate id', () => L.registerCharacter({ id: 'surgeon', define: (base) => ({ ...base }) }));
    expectThrow('backSkullColor naming a missing colour', () => L.registerCharacter({ id: 'check_tmp_1', define: (base) => ({ ...base, backSkullColor: 'missing' }) }));
    // Khoá trang phục dưới / dáng / đồ cầm tay khai sai phải bị từ chối, không được lặng lẽ vẽ ra thứ khác.
    for (const [label, wrong] of [['skirt as a string', { skirt: 'apron' }], ['skirt with an unknown kind', { skirt: { kind: 'dress' } }], ['skirt without kind', { skirt: { length: 1 } }],
                                  ['skirt with a misspelt key', { skirt: { kind: 'skirt', lenght: 1 } }], ['skirt.length out of range', { skirt: { kind: 'skirt', length: 9 } }],
                                  ['stoop out of range', { stoop: 5 }], ['stoop as a boolean', { stoop: true }], ['heldItemR as a string', { heldItemR: 'cup' }],
                                  ['hair that is not a function', { hair: '<g/>' }], ['accessories returning nothing', { accessories: () => {} }]])
      expectThrow(label, () => L.registerCharacter({ id: 'check_tmp_bad', define: (base) => ({ ...base, ...wrong }) }));
    if (RigSVG.NHAN_VAT.check_tmp_bad) hong('registerCharacter', 'a rejected definition was registered anyway');
    // Bỏ mũ mà quên đặt lại mauSoSau: sọ sau vẫn phải ra màu tóc.
    const noHat = new RigSVG(host, { ...RigSVG.NHAN_VAT.surgeon, mu: () => '' });
    const fill = noHat.svg.querySelector('#' + noHat.id + '-tocLungE').getAttribute('fill');
    if (fill !== noHat.mau.toc) hong('guards', `hat removed but the back of the head is ${fill}, expected the hair colour ${noHat.mau.toc}`);
  }

  // ── Mọi tệp trong configs/ phải hợp lệ (studio ghi ra, nhưng người cũng sửa tay) ──
  try {
    const listing = await (await fetch('../configs/', { cache: 'no-store' })).text();
    const files = [...listing.matchAll(/href="([^"?]+\.json)"/g)].map((m) => decodeURIComponent(m[1]));
    ra.configs = files.length;
    // Bản dựng phải nướng ĐÚNG các tệp đang có trong configs/ — không thiếu, không thừa.
    const baked = (window[L.GLOBAL_NAME] ? window[L.GLOBAL_NAME].list().bakedConfigs : []).slice().sort().join(',');
    const onDisk = files.map((f) => f.replace(/\.json$/, '')).sort().join(',');
    if (baked !== onDisk) hong('dist', `configs baked into the bundle [${baked}] differ from configs/ [${onDisk}] — run: python3 tools/build.py`);
    for (const file of files) {
      const id = file.replace(/\.json$/, ''), kind = id in RigThu.LOAI ? 'pet' : 'person';
      if (kind === 'person' && !(id in RigSVG.NHAN_VAT)) { hong(`configs/${file}`, 'no character has this id'); continue; }
      let config; try { config = await (await fetch('../configs/' + file, { cache: 'no-store' })).json(); } catch (e) { hong(`configs/${file}`, 'not valid JSON'); continue; }
      for (const problem of L.validateConfig(config, kind)) hong(`configs/${file}`, problem);
    }
  } catch (e) { hong('configs', 'cannot list the folder: ' + e.message); }

  // ── MỌI động tác, đặt GIỮA một chuỗi: tua tới cùng một thời điểm từ phía trước và từ phía
  //    sau phải ra đúng một trạng thái. (Trước khi sequence() lấy mẫu sẵn, enter / walkForward /
  //    walkAway ở giữa chuỗi lệch cả vị trí lẫn độ mờ; phép thử cũ chỉ thử enter ở ĐẦU chuỗi.)
  { const sweep = (rig, label) => {
      const keys = Object.keys(rig.NGHI), read = () => JSON.stringify(keys.map((k) => (typeof rig.s[k] === 'number' ? +rig.s[k].toFixed(3) : rig.s[k])));
      for (const name of rig.actions) {
        if (name === 'idle') continue;
        L.seed(3); rig.reset();
        const step = name === 'point' ? [name, { x: 60, y: 80 }] : (name === 'speak' || name === 'explain') ? [name, 'xin chào bạn nhé một hai ba', 2.4] : name;
        const t = L.sequence(rig, ['idle', step, 'idle']), D = t.duration();
        let differ = 0;
        for (let n = 1; n < 30; n++) { const at = D * n / 30; t.totalTime(0, false); t.totalTime(at, false); const a = read(); t.totalTime(D, false); t.totalTime(at, false); if (read() !== a) differ++; }
        if (differ) hong('sequence', `${label}.${name}: seeking to the same time from before and from after gives different states at ${differ}/29 sample points`);
        t.kill();
      }
    };
    sweep(new RigSVG(document.getElementById('san'), 'vet'), 'vet');
    sweep(new RigThu(document.getElementById('san2'), 'dog'), 'dog');
    sweep(new RigThu(document.getElementById('san2'), 'cat'), 'cat');
    L.seed(null);
  }

  // ── Tư thế nghỉ tuỳ chỉnh (nghiêng đầu, nắm tay) phải được mọi động tác tôn trọng ──
  { L.registerCharacter({ id: 'check_tmp_3', base: 'vet', define: (base) => ({ ...base, restPose: { ...base.restPose, headTilt: 4, handR: 'fist', smile: 0.2 } }) });
    const rig = L.createCharacter(document.getElementById('san'), { id: 'check_tmp_3' }).rig;
    for (const name of rig.actions) {
      if (['walkAway', 'exit'].includes(name)) continue;
      rig.reset();
      const t = name === 'point' ? rig.point({ x: 60, y: 80 }) : rig[name](); t.progress(1); rig.apDung();
      if (Math.abs(rig.state.headTilt - 4) > 1e-3 || rig.state.handR !== 'fist') hong('restPose', `${name}: ends with headTilt ${rig.state.headTilt}, handR ${rig.state.handR} instead of the character's rest pose (4, fist)`);
      t.kill();
    }
    // Ngồi: bóng phải ở lại dưới bàn chân.
    rig.reset(); const box = (el) => el.getBoundingClientRect(); const foot = box(rig.el.banL).bottom, shadow = box(rig.el.bong).top;
    const t = rig.sit(1); t.progress(0.5); rig.apDung();
    if (Math.abs(box(rig.el.banL).bottom - foot) > 1.5) hong('sit', 'feet leave the ground while sitting');
    if (Math.abs(box(rig.el.bong).top - shadow) > 1.5) hong('sit', 'the ground shadow moves away from the feet while sitting');
    t.kill();
    // Thế đứng GIỮ NGUYÊN: ngồi rồi nói vẫn còn ngồi; quay mặt rồi gật vẫn còn quay; đứng dậy / nhìn thẳng thì về 0.
    {
      const stance = L.sequence(rig, [['sitDown'], ['explain', 'xin chao', 1], ['face', 'left'], ['nod'], ['walk', 2], ['standUp'], ['face', 'front'], ['wave']]);
      const at = (index, frac) => { const step = stance.data.steps[index]; stance.time(step.start + step.duration * frac); return rig.state; };
      if (Math.abs(at(1, 0.5).seat - 1) > 1e-3 || Math.abs(at(1, 1).seat - 1) > 1e-3) hong('sitDown', 'the character stands up during / after the next action');
      if (Math.abs(at(3, 1).facing + 0.55) > 1e-3 || Math.abs(at(3, 1).seat - 1) > 1e-3) hong('face', `facing is ${rig.state.facing} after the next action instead of -0.55`);
      if (Math.abs(at(4, 1).facing + 0.55) > 1e-3) hong('face', `walk does not return to the held facing (${rig.state.facing})`);
      if (Math.abs(at(7, 1).seat) > 1e-3 || Math.abs(rig.state.facing) > 1e-3) hong('standUp', 'standUp / face("front") do not return to standing, facing front');
      stance.kill(); rig.reset();
      const stowed = L.sequence(rig, [['hideItem', 'R'], ['wave'], ['showItem', 'R'], ['nod']]);
      stowed.time(stowed.data.steps[1].start + stowed.data.steps[1].duration); if (rig.state.itemR > 1e-3) hong('hideItem', 'the item comes back after the next action');
      stowed.time(stowed.duration()); if (rig.state.itemR < 0.999) hong('showItem', 'the item is not back');
      stowed.kill(); rig.reset();
      // face(target): quay về phía một phần tử trên màn hình.
      const mark = document.createElement('div'); mark.style.cssText = 'position:fixed;left:-500px;top:0;width:10px;height:10px'; document.body.appendChild(mark);
      const toward = rig.face(mark); toward.progress(1); if (!(rig.state.facing < 0)) hong('face', 'face(element) does not turn toward an element on the left');
      toward.kill(); mark.remove(); rig.reset();
    }
    // Váy, tạp dề, đồ cầm tay, dáng còng: vẽ không lỗi ở mọi tư thế; váy ngắn lại khi ngồi; đồ vật ẩn được.
    {
      L.registerCharacter({ id: 'check_tmp_5', base: 'nurse', define: (base, kit) => ({ ...base, ...kit.outfits.shirt, stoop: 1, skirt: { kind: 'skirt', length: 1.4 },
        faceExtras: (p, c) => kit.parts.wrinkles(c), heldItemL: (p, c) => kit.parts.clipboard(c), heldItemR: (p, c) => kit.parts.cup(c) }) });
      L.registerCharacter({ id: 'check_tmp_6', base: 'default', define: (base, kit) => ({ ...base, ...kit.outfits.tee, skirt: { kind: 'apron' },
        accessories: (p, c) => `<g id="${p}-accessories">${kit.parts.apronBib(c)}</g>`, heldItemR: (p, c) => kit.parts.phone(c) }) });
      for (const id of ['check_tmp_5', 'check_tmp_6']) {
        const dressed = L.createCharacter(document.getElementById('san'), { id }).rig, hem = dressed.svg.querySelector('[id$="-skirt"]');
        if (!hem) { hong(id, 'no skirt element'); continue; }
        for (const [name, progress] of [['walk', 0.3], ['march', 0.3], ['sit', 0.5], ['turn', 0.5], ['wave', 0.4]]) {
          const t = dressed[name](); t.progress(progress); dressed.apDung();
          if (xau(dressed.svg)) hong(id, `${name}: bad attribute values with skirt / held items`);
          t.kill(); dressed.reset();
        }
        const standing = hem.getBoundingClientRect().height; dressed.state.seat = 1; dressed.render();
        if (!(hem.getBoundingClientRect().height < standing * 0.8)) hong(id, 'the skirt does not shorten when seated');
        dressed.reset(); dressed.state.itemR = 0; dressed.render();
        if (dressed.svg.querySelector('[id$="-itemR"]').getAttribute('opacity') !== '0') hong(id, 'state.itemR = 0 does not hide the held item');
        if (trungId(dressed.svg).length) hong(id, 'duplicate ids: ' + trungId(dressed.svg).join(', '));
        dressed.svg.remove();
      }
    }
    // Hói: không còn tóc phía sau khi quay.
    L.registerCharacter({ id: 'check_tmp_4', base: 'surgeon', define: (base) => ({ ...base, hat: () => '', backHair: 'none' }) });
    const bald = L.createCharacter(document.getElementById('san'), { id: 'check_tmp_4' }).rig; bald.state.facing = 1; bald.render();
    if (bald.el.tocGayP.getAttribute('d') !== '' || bald.el.tocLungE.getAttribute('fill') !== bald.mau.da) hong('backHair', "backHair: 'none' still draws hair behind the head");
  }

  // ── LƯỢC ĐỒ CÔNG KHAI: tên tiếng Anh phải tới được đúng chỗ trong rig ──
  { const host = document.getElementById('san');
    L.registerCharacter({ id: 'check_tmp_2', base: 'surgeon', define: (base, kit) => ({
      ...base, name: 'kiểm', hat: () => '', headSize: 1.11, longSleeves: true,
      colors: { ...base.colors, hair: '#888888', top: '#123456' },
      restPose: { upperArmL: 33, smile: 0.5, handL: 'fist' },
      faceExtras: (p, c) => kit.parts.roundGlasses(c), beard: (p, c) => kit.parts.shortBeard(c),
      hair: (p, c) => `<g id="${p}-hair-front" fill="${c.hair}"><circle r="40"/></g>`,
    }) });
    const rig = L.createCharacter(host, { id: 'check_tmp_2' }).rig;
    const expect = (label, got, want) => { if (got !== want) hong('schema', `${label}: got ${JSON.stringify(got)}, expected ${JSON.stringify(want)}`); };
    expect('headSize → coDau', rig.nv.coDau, 1.11);
    expect('longSleeves → tayDai', rig.nv.tayDai, true);
    expect('colors.top → mau.ao', rig.mau.ao, '#123456');
    expect('bí danh màu c.hair', rig.mau.hair, '#888888');
    expect('restPose.upperArmL → NGHI.batL', rig.NGHI.batL, 33);
    expect('restPose.handL fist → nam', rig.NGHI.tayL, 'nam');
    expect('id hair-front → tocTruoc', !!rig.el.tocTruoc, true);
    expect('slot beard được vẽ', rig.svg.querySelector('#' + rig.id + '-beard').children.length > 0, true);
    expect('state.smile đọc', rig.state.smile, 0.5);
    rig.state.upperArmR = 77; expect('state.upperArmR ghi → s.batR', rig.s.batR, 77);
    rig.setColors({ top: '#654321' }); expect('setColors({top})', rig.mau.ao, '#654321');
    expect('partsOf("doctor").faceExtras là hàm', typeof L.kit.partsOf('doctor').faceExtras, 'function');
    for (const name of ['happy', 'sad', 'surprised', 'angry', 'thinking']) { const t = rig.express(name, 0.5); t.progress(0.5); t.kill(); }
    // Thú: hình dáng + giống
    const pet = L.createPet(document.getElementById('san2'), { species: 'shiba', config: { shape: { legLength: 0.7, headSize: 1.2 }, colors: { fur: '#445566' } } }).rig;
    expect('pet shape.legLength', pet.shape.legLength, 0.7);
    expect('pet colors.fur → mau.long', pet.mau.long, '#445566');
    if (xau(pet.svg)) hong('schema', 'pet has broken attributes after applying a shape');
  }

  // ── Tư thế nghỉ LỆCH hai tay (một tay cầm đồ) phải sống sót qua bộ số của studio ──
  {
    const host = document.getElementById('san');
    const plain = L.createCharacter(host, { id: 'barista', config: null }).rig;
    const gap = plain.state.upperArmL - plain.state.upperArmR, bend = plain.state.forearmL - plain.state.forearmR;
    const tuned = L.createCharacter(host, { id: 'barista', config: { arms: { restUpperArm: 30, restForearm: -60 } } }).rig;
    if (Math.abs(tuned.state.upperArmR - 30) > 1e-6 || Math.abs(tuned.state.forearmR + 60) > 1e-6) hong('config arms', 'restUpperArm / restForearm do not set the right arm');
    if (Math.abs(tuned.state.upperArmL - tuned.state.upperArmR - gap) > 1e-6 || Math.abs(tuned.state.forearmL - tuned.state.forearmR - bend) > 1e-6)
      hong('config arms', 'a config with rest arm angles flattens a character whose two arms rest differently');
    if (!gap && !bend) hong('barista', 'expected a one-armed rest pose to test with');
    plain.svg.remove(); tuned.svg.remove();
  }

  // ── Công cụ SOÁT BẰNG MẮT cũng phải chạy: bảng tư thế đủ ô, gallery đủ nhân vật ──
  {
    const load = (url) => new Promise((resolve) => {
      const frame = document.createElement('iframe'); frame.style.cssText = 'position:fixed;left:-3000px;width:1280px;height:1500px'; frame.src = url; document.body.appendChild(frame);
      const started = Date.now();
      const poll = () => { let title = ''; try { title = frame.contentDocument.title; } catch (error) { /* chưa tải xong */ }
        if (title === 'DONE' || Date.now() - started > 8000) resolve({ frame, done: title === 'DONE' }); else setTimeout(poll, 50); };
      poll();
    });
    const cells = (frame) => [...frame.contentDocument.body.children].filter((el) => el.tagName === 'DIV');
    const names = JSON.parse(listAtStart);
    for (const [id, expected] of [['receptionist', 22], ['dog', 2 + RigThu.DONG_TAC.dog.length - 1]]) {
      const { frame, done } = await load(`sheet.html?nv=${id}`);
      if (!done) hong(`sheet.html?nv=${id}`, 'the pose sheet does not finish (script error?)');
      else if (cells(frame).length !== expected) hong(`sheet.html?nv=${id}`, `the pose sheet shows ${cells(frame).length} panels, expected ${expected}`);
      else if (cells(frame).some((el) => !el.querySelector('svg'))) hong(`sheet.html?nv=${id}`, 'a panel is empty');
      frame.remove();
    }
    const { frame, done } = await load('gallery.html'), wanted = Object.keys(names.people).length + Object.keys(names.pets).length;
    if (!done) hong('gallery.html', 'the gallery does not finish (script error?)');
    else if (cells(frame).length !== wanted) hong('gallery.html', `the gallery shows ${cells(frame).length} characters, expected ${wanted}`);
    frame.remove();
  }

  // ── Bản SLIM phải chạy ra cùng kết quả với bản đầy đủ ──
  try {
    const slimSource = await (await fetch('../dist/character.slim.js', { cache: 'no-store' })).text();
    const Slim = new Function(slimSource + '\nreturn VGCharacter;')();
    if (listOf(Slim) !== listAtStart) hong('dist', 'character.slim.js is out of date — run: python3 tools/build.py');
    const a = document.createElement('div'), b = document.createElement('div'); document.body.append(a, b);
    const strip = (svg) => svg.innerHTML.replace(/rig\d+|thu\d+/g, 'ID');
    const markup = (lib, host) => strip(lib.createCharacter(host, { id: 'doctor', config: null }).rig.svg);
    if (markup(Slim, a) !== markup(L, b)) hong('dist', 'the slim bundle renders differently from the full one');
    a.remove(); b.remove();
  } catch (e) { hong('dist', 'the slim bundle does not run: ' + e.message); }

  // Bản dựng IIFE phải tươi: cùng danh sách nhân vật với mã nguồn.
  const G = window[L.GLOBAL_NAME];
  if (!G) hong('dist', 'dist/character.iife.js failed to load — run: python3 tools/build.py');
  else {
    const a = listOf(G), b = listAtStart;
    ra.banDung.khop = a === b;
    if (a !== b) hong('dist', 'dist/character.iife.js is out of date — run: python3 tools/build.py');
    const h = document.createElement('div'); document.body.appendChild(h);
    try { const { rig } = G.createCharacter(h, { id: 'vet', config: { colors: { top: '#2f9e8f' } } }); if (rig.mau.ao !== '#2f9e8f') hong('dist', 'createCharacter ignored the config'); }
    catch (e) { hong('dist', 'createCharacter threw: ' + e.message); }
    h.remove();
  }
} catch (e) { hong('check', e.stack || String(e)); }
document.getElementById('kq').textContent = JSON.stringify(ra);
document.title = ra.ok ? 'PASS' : 'FAIL';
</script>
