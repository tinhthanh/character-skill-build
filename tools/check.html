<!doctype html>
<meta charset="utf-8">
<title>đang kiểm…</title>
<!-- Kiểm tra tự động MỌI nhân vật × MỌI động tác. Mở qua tools/serve.py, hoặc chạy tools/check.sh.
     Kết quả là JSON trong thẻ pre#kq; document.title thành PASS hoặc FAIL. -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="../dist/character.iife.js"></script>
<div id="san" style="width:400px;height:470px"></div><div id="san2" style="width:400px;height:330px"></div>
<pre id="kq"></pre>
<script type="module">
const ra = { ok: true, loi: [], nhanVat: {}, banDung: {} };
const hong = (cho, chu) => { ra.ok = false; ra.loi.push(`${cho}: ${chu}`); };
window.addEventListener('error', (e) => hong('page', e.message));
try {
  const L = await import('../runtime/index.js');
  const { RigSVG, RigThu } = L;
  const S = await import('../runtime/schema.js');
  // Thông báo lỗi dùng TÊN CÔNG KHAI: người viết nhân vật khai `headTilt`, không biết `dau` là gì.
  const stateNames = Object.fromEntries([...Object.entries(S.PET_STATE_KEYS), ...Object.entries(S.PERSON_STATE_KEYS)].map(([pub, internal]) => [internal, pub]));
  const publicKey = (key) => stateNames[key] || key;
  const REQUIRED = Object.fromEntries(S.REQUIRED_IDS.map(([pub, internal]) => [internal, pub]));
  // Danh sách nhân vật, chụp TRƯỚC khi các phép thử đăng ký nhân vật tạm. Bỏ `bakedConfigs` ra:
  // bộ số chỉ được nướng vào bản dựng, mã nguồn dạng module không có — so riêng ở dưới.
  const listOf = (lib) => { const { bakedConfigs, ...rest } = lib.list(); return JSON.stringify(rest); };
  const listAtStart = listOf(L);
  const xau = (svg) => { let n = 0; svg.querySelectorAll('*').forEach((el) => { for (const a of el.attributes) if (/NaN|undefined|null|Infinity/.test(a.value)) n++; }); return n; };
  const trungId = (svg) => { const m = {}; svg.querySelectorAll('[id]').forEach((e) => { m[e.id] = (m[e.id] || 0) + 1; }); return Object.keys(m).filter((k) => m[k] > 1); };
  const quet = (rig, ten, dsDongTac, duocLech) => {
    const o = ra.nhanVat[ten] = { dongTac: dsDongTac.length };
    const t0 = trungId(rig.svg); if (t0.length) hong(ten, 'duplicate element ids: ' + t0.join(','));
    if (xau(rig.svg)) hong(ten, 'broken SVG attributes (NaN / undefined) at rest');
    for (const m of dsDongTac) {
      rig.datNghi();
      let t;
      try { t = m === 'point' ? rig.point({ x: 60, y: 80 }) : (m === 'speak' || m === 'explain') ? rig[m]('Xin chào, rất vui được gặp bạn!', 2.4) : rig[m](); }
      catch (e) { hong(`${ten}.${m}`, 'threw while building: ' + e.message); continue; }
      let n = 0;
      for (let i = 0; i <= 60; i++) { t.progress(i / 60); rig.apDung(); n += xau(rig.svg); }
      if (n) hong(`${ten}.${m}`, `${n} NaN/undefined attributes during the action`);
      const lech = Object.keys(rig.NGHI).filter((q) => (typeof rig.NGHI[q] === 'number' ? Math.abs(rig.s[q] - rig.NGHI[q]) > 1e-3 : rig.s[q] !== rig.NGHI[q]));
      if (lech.length && !duocLech.includes(m)) hong(`${ten}.${m}`, 'does not return to the rest pose: ' + lech.map(publicKey).join(', '));
      t.kill();
    }
    // Slot bắt buộc
    for (const id of o.canCo || []) if (!rig.svg.querySelector(`#${rig.id}-${id}`)) hong(ten, `missing element #…-${id}`);
  };
  // Không DỊCH CHUYỂN TỨC THỜI: dựng một chuỗi rồi đi từng khung 1/30 s — không khung nào được
  // nhảy xa. Chạy ĐẦU TIÊN, trên trang còn sạch: lỗi này (tween ghi nhớ sai giá trị đầu do cơ
  // chế lazy của GSAP — nhân vật bước vào xong giật về điểm xuất phát) chỉ lộ ra khi tween
  // được vẽ lần đầu bằng một cú nhảy, đúng tình huống của bộ dựng video.
  for (const [ten, tao, buoc] of [['vet', (h) => new RigSVG(h, 'vet'), ['enter', 'wave', ['walk', 4, 100], 0.3, 'nod']],
                                  ['dog', (h) => new RigThu(h, 'dog'), ['enter', 'wagTail', ['walk', 4, 80], 'sit']]]) {
    const rig = tao(document.getElementById('san')), t = L.sequence(rig, buoc);
    let truoc = null;
    for (let k = 0; k <= Math.ceil(t.duration() * 30); k++) {
      t.totalTime(k / 30, false);
      if (truoc !== null && Math.abs(rig.s.x - truoc) > 16) { hong('sequence', `${ten}: position jumps between two consecutive frames — frame ${k}: x ${truoc.toFixed(0)} → ${rig.s.x.toFixed(0)}`); break; }
      truoc = rig.s.x;
    }
    if (rig.tl().vars.defaults.lazy !== false) hong(ten, 'rig timelines must have defaults.lazy = false');
  }

  for (const k of Object.keys(RigSVG.NHAN_VAT)) {
    const rig = new RigSVG(document.getElementById('san'), k);
    for (const id of ['tocTruoc', 'matL', 'matR', 'nguoiL', 'nguoiR', 'banL', 'banR'])
      if (!rig.svg.querySelector(`#${rig.id}-${id}`)) hong(k, `missing required element id "\${p}-${REQUIRED[id]}" (see references/slots.md)`);
    quet(rig, k, [...RigSVG.DONG_TAC, ...RigSVG.DI_NGANG], ['walkAway', 'exit']);
    // đổi màu + bộ số không được làm hỏng
    try { rig.doiMau({ ao: '#8a5ad6', toc: '#6b4b2f' }); L.applyConfig(rig, { proportions: { headSize: 1.2 }, faceShape: { halfWidth: 44 } }); if (xau(rig.svg)) hong(k, 'broken SVG attributes after setColors / applyConfig'); }
    catch (e) { hong(k, 'setColors / applyConfig threw: ' + e.message); }
  }
  for (const k of Object.keys(RigThu.LOAI)) { const pet = new RigThu(document.getElementById('san2'), k); quet(pet, k, pet.DONG_TAC, ['exit']); }

  // Tính tất định: gieo cùng hạt phải ra cùng timeline.
  { const rig = new RigSVG(document.getElementById('san'), 'vet');
    const dau = (t) => JSON.stringify(t.getChildren(true, true, false).map((c) => [c.startTime().toFixed(3), c.duration().toFixed(3)]));
    L.seed(3); const a = dau(rig.explain('một hai ba bốn', 2)); L.seed(3); const b = dau(rig.explain('một hai ba bốn', 2)); L.seed(null);
    if (a !== b) hong('seed', 'the same seed produced two different timelines'); }

  // sequence(): khung 0 phải đúng trạng thái đầu của bước đầu; tua tới đâu cũng ra đúng một trạng thái.
  { const rig = new RigSVG(document.getElementById('san'), 'surgeon');
    const t = L.sequence(rig, ['enter', 'wave', ['walk', 4, 100], 0.3, 'nod']);
    t.seek(0); rig.apDung(); const x0 = rig.s.x;
    if (x0 > -268) hong('sequence', `frame 0: x = ${x0.toFixed(1)}, expected −270 or further out (enter)`);
    const chup = (tg) => { t.seek(tg); rig.apDung(); return JSON.stringify(Object.keys(rig.NGHI).map((k) => (typeof rig.s[k] === 'number' ? +rig.s[k].toFixed(3) : rig.s[k]))); };
    const tg = t.duration() * 0.63, a = chup(tg); chup(0.2); chup(t.duration()); const b = chup(tg);
    if (a !== b) hong('sequence', 'seeking to one time by two paths gives two states');
    t.seek(t.duration()); rig.apDung();
    if (Math.abs(rig.s.x - 100) > 1) hong('sequence', `end of sequence: x = ${rig.s.x.toFixed(1)}, expected 100`);
    // Tua bằng seek() — GSAP tắt mọi callback — hình vẫn phải đổi theo (rig tự vẽ lại ở microtask).
    const hinh = () => rig.el.goc.getAttribute('transform') + rig.el.batR.getAttribute('transform');
    t.totalTime(1.0, false); const dung = hinh();
    t.totalTime(3.0, false); t.seek(1.0); await Promise.resolve();
    if (hinh() !== dung) hong('sequence', 'seek() (callbacks suppressed) does not redraw');
    ra.kichBan = { dai: +t.duration().toFixed(2) }; }

  // ── Các lớp CHẶN LỖI IM LẶNG phải còn hoạt động ──
  { const expectThrow = (label, fn) => { try { fn(); hong('guards', `${label}: should have thrown`); } catch (e) { /* đúng */ } };
    const host = document.getElementById('san');
    const problems = L.validateConfig({ proportionz: { headSize: 2 }, faceShape: { halfWidth: 'wide', crownHeight: 50 }, colors: { top: 'green' }, restPose: { upperArmL: 'x' } });
    if (problems.length !== 4) hong('guards', `validateConfig should report 4 problems, reported ${problems.length}: ${problems.join(' | ')}`);
    if (L.validateConfig({ proportions: { headSize: 1.2 }, colors: { top: '#2f9e8f' }, restPose: { smile: 1, handL: 'fist' } }).length) hong('guards', 'validateConfig rejects a valid config');
    if (L.validateConfig({ shape: { legLength: 0.8 }, colors: { fur: '#333333' } }, 'pet').length) hong('guards', 'validateConfig rejects a valid pet config');
    expectThrow('createCharacter with a wrongly typed config', () => L.createCharacter(host, { id: 'surgeon', config: { faceShape: { halfWidth: 'wide' } } }));
    expectThrow('createPet with an unknown species', () => L.createPet(host, { species: 'rabbit' }));
    expectThrow('setColors with a colour name', () => new RigSVG(host, 'default').setColors({ top: 'red' }));
    expectThrow('registering a duplicate id', () => L.registerCharacter({ id: 'surgeon', define: (base) => ({ ...base }) }));
    expectThrow('backSkullColor naming a missing colour', () => L.registerCharacter({ id: 'check_tmp_1', define: (base) => ({ ...base, backSkullColor: 'missing' }) }));
    // Khoá trang phục dưới / dáng / đồ cầm tay khai sai phải bị từ chối, không được lặng lẽ vẽ ra thứ khác.
    for (const [label, wrong] of [['skirt as a string', { skirt: 'apron' }], ['skirt with an unknown kind', { skirt: { kind: 'dress' } }], ['skirt without kind', { skirt: { length: 1 } }],
                                  ['skirt with a misspelt key', { skirt: { kind: 'skirt', lenght: 1 } }], ['skirt.length out of range', { skirt: { kind: 'skirt', length: 9 } }],
                                  ['stoop out of range', { stoop: 5 }], ['stoop as a boolean', { stoop: true }], ['heldItemR as a string', { heldItemR: 'cup' }],
                                  ['top as a path string', { top: 'M 0 0 L 1 1' }], ['top returning undefined', { top: () => undefined }],
                                  ['hair that is not a function', { hair: '<g/>' }], ['accessories returning nothing', { accessories: () => {} }]])
      expectThrow(label, () => L.registerCharacter({ id: 'check_tmp_bad', define: (base) => ({ ...base, ...wrong }) }));
    if (RigSVG.NHAN_VAT.check_tmp_bad) hong('registerCharacter', 'a rejected definition was registered anyway');
    // Bỏ mũ mà quên đặt lại mauSoSau: sọ sau vẫn phải ra màu tóc.
    const noHat = new RigSVG(host, { ...RigSVG.NHAN_VAT.surgeon, mu: () => '' });
    const fill = noHat.svg.querySelector('#' + noHat.id + '-tocLungE').getAttribute('fill');
    if (fill !== noHat.mau.toc) hong('guards', `hat removed but the back of the head is ${fill}, expected the hair colour ${noHat.mau.toc}`);
  }

  // ── Mọi tệp trong configs/ phải hợp lệ (studio ghi ra, nhưng người cũng sửa tay) ──
  try {
    const listing = await (await fetch('../configs/', { cache: 'no-store' })).text();
    const files = [...listing.matchAll(/href="([^"?]+\.json)"/g)].map((m) => decodeURIComponent(m[1]));
    ra.configs = files.length;
    // Bản dựng phải nướng ĐÚNG các tệp đang có trong configs/ — không thiếu, không thừa.
    const baked = (window[L.GLOBAL_NAME] ? window[L.GLOBAL_NAME].list().bakedConfigs : []).slice().sort().join(',');
    const onDisk = files.map((f) => f.replace(/\.json$/, '')).sort().join(',');
    if (baked !== onDisk) hong('dist', `configs baked into the bundle [${baked}] differ from configs/ [${onDisk}] — run: python3 tools/build.py`);
    for (const file of files) {
      const id = file.replace(/\.json$/, ''), kind = id in RigThu.LOAI ? 'pet' : 'person';
      if (kind === 'person' && !(id in RigSVG.NHAN_VAT)) { hong(`configs/${file}`, 'no character has this id'); continue; }
      let config; try { config = await (await fetch('../configs/' + file, { cache: 'no-store' })).json(); } catch (e) { hong(`configs/${file}`, 'not valid JSON'); continue; }
      for (const problem of L.validateConfig(config, kind)) hong(`configs/${file}`, problem);
    }
  } catch (e) { hong('configs', 'cannot list the folder: ' + e.message); }

  // ── MỌI động tác, đặt GIỮA một chuỗi: tua tới cùng một thời điểm từ phía trước và từ phía
  //    sau phải ra đúng một trạng thái. (Trước khi sequence() lấy mẫu sẵn, enter / walkForward /
  //    walkAway ở giữa chuỗi lệch cả vị trí lẫn độ mờ; phép thử cũ chỉ thử enter ở ĐẦU chuỗi.)
  { const sweep = (rig, label) => {
      const keys = Object.keys(rig.NGHI), read = () => JSON.stringify(keys.map((k) => (typeof rig.s[k] === 'number' ? +rig.s[k].toFixed(3) : rig.s[k])));
      for (const name of rig.actions) {
        if (name === 'idle' || (rig.constructor.EXCHANGE || []).includes(name)) continue;       // `handOver` / `take` cần một món đồ — có bài kiểm riêng
        L.seed(3); rig.reset();
        const step = name === 'point' ? [name, { x: 60, y: 80 }] : (name === 'speak' || name === 'explain') ? [name, 'xin chào bạn nhé một hai ba', 2.4] : name;
        const t = L.sequence(rig, ['idle', step, 'idle']), D = t.duration();
        let differ = 0;
        for (let n = 1; n < 30; n++) { const at = D * n / 30; t.totalTime(0, false); t.totalTime(at, false); const a = read(); t.totalTime(D, false); t.totalTime(at, false); if (read() !== a) differ++; }
        if (differ) hong('sequence', `${label}.${name}: seeking to the same time from before and from after gives different states at ${differ}/29 sample points`);
        t.kill();
      }
    };
    sweep(new RigSVG(document.getElementById('san'), 'vet'), 'vet');
    sweep(new RigThu(document.getElementById('san2'), 'dog'), 'dog');
    sweep(new RigThu(document.getElementById('san2'), 'cat'), 'cat');
    L.seed(null);
  }

  // ── Tư thế nghỉ tuỳ chỉnh (nghiêng đầu, nắm tay) phải được mọi động tác tôn trọng ──
  { L.registerCharacter({ id: 'check_tmp_3', base: 'vet', define: (base) => ({ ...base, restPose: { ...base.restPose, headTilt: 4, handR: 'fist', smile: 0.2 } }) });
    const rig = L.createCharacter(document.getElementById('san'), { id: 'check_tmp_3' }).rig;
    for (const name of rig.actions) {
      if (['walkAway', 'exit', 'handOver', 'take'].includes(name)) continue;
      rig.reset();
      const t = name === 'point' ? rig.point({ x: 60, y: 80 }) : rig[name](); t.progress(1); rig.apDung();
      if (Math.abs(rig.state.headTilt - 4) > 1e-3 || rig.state.handR !== 'fist') hong('restPose', `${name}: ends with headTilt ${rig.state.headTilt}, handR ${rig.state.handR} instead of the character's rest pose (4, fist)`);
      t.kill();
    }
    // Ngồi: bóng phải ở lại dưới bàn chân.
    rig.reset(); const box = (el) => el.getBoundingClientRect(); const foot = box(rig.el.banL).bottom, shadow = box(rig.el.bong).top;
    const t = rig.sit(1); t.progress(0.5); rig.apDung();
    if (Math.abs(box(rig.el.banL).bottom - foot) > 1.5) hong('sit', 'feet leave the ground while sitting');
    if (Math.abs(box(rig.el.bong).top - shadow) > 1.5) hong('sit', 'the ground shadow moves away from the feet while sitting');
    t.kill();
    // Thế đứng GIỮ NGUYÊN: ngồi rồi nói vẫn còn ngồi; quay mặt rồi gật vẫn còn quay; đứng dậy / nhìn thẳng thì về 0.
    {
      const stance = L.sequence(rig, [['sitDown'], ['explain', 'xin chao', 1], ['face', 'left'], ['nod'], ['walk', 2], ['standUp'], ['face', 'front'], ['wave']]);
      const at = (index, frac) => { const step = stance.data.steps[index]; stance.time(step.start + step.duration * frac); return rig.state; };
      if (Math.abs(at(1, 0.5).seat - 1) > 1e-3 || Math.abs(at(1, 1).seat - 1) > 1e-3) hong('sitDown', 'the character stands up during / after the next action');
      if (Math.abs(at(3, 1).facing + 0.55) > 1e-3 || Math.abs(at(3, 1).seat - 1) > 1e-3) hong('face', `facing is ${rig.state.facing} after the next action instead of -0.55`);
      if (Math.abs(at(4, 1).facing + 0.55) > 1e-3) hong('face', `walk does not return to the held facing (${rig.state.facing})`);
      if (Math.abs(at(7, 1).seat) > 1e-3 || Math.abs(rig.state.facing) > 1e-3) hong('standUp', 'standUp / face("front") do not return to standing, facing front');
      stance.kill(); rig.reset();
      const stowed = L.sequence(rig, [['hideItem', 'R'], ['wave'], ['showItem', 'R'], ['nod']]);
      stowed.time(stowed.data.steps[1].start + stowed.data.steps[1].duration); if (rig.state.itemR > 1e-3) hong('hideItem', 'the item comes back after the next action');
      stowed.time(stowed.duration()); if (rig.state.itemR < 0.999) hong('showItem', 'the item is not back');
      stowed.kill(); rig.reset();
      // face(target): quay về phía một phần tử trên màn hình.
      const mark = document.createElement('div'); mark.style.cssText = 'position:fixed;left:-500px;top:0;width:10px;height:10px'; document.body.appendChild(mark);
      const toward = rig.face(mark); toward.progress(1); if (!(rig.state.facing < 0)) hong('face', 'face(element) does not turn toward an element on the left');
      toward.kill(); mark.remove(); rig.reset();
    }
    // Váy, tạp dề, đồ cầm tay, dáng còng: vẽ không lỗi ở mọi tư thế; váy ngắn lại khi ngồi; đồ vật ẩn được.
    {
      L.registerCharacter({ id: 'check_tmp_5', base: 'nurse', define: (base, kit) => ({ ...base, ...kit.outfits.shirt, stoop: 1, skirt: { kind: 'skirt', length: 1.4 },
        faceExtras: (p, c) => kit.parts.wrinkles(c), heldItemL: (p, c) => kit.parts.clipboard(c), heldItemR: (p, c) => kit.parts.cup(c) }) });
      L.registerCharacter({ id: 'check_tmp_6', base: 'default', define: (base, kit) => ({ ...base, ...kit.outfits.tee, skirt: { kind: 'apron' },
        accessories: (p, c) => `<g id="${p}-accessories">${kit.parts.apronBib(c)}</g>`, heldItemR: (p, c) => kit.parts.phone(c) }) });
      for (const id of ['check_tmp_5', 'check_tmp_6']) {
        const dressed = L.createCharacter(document.getElementById('san'), { id }).rig, hem = dressed.svg.querySelector('[id$="-skirt"]');
        if (!hem) { hong(id, 'no skirt element'); continue; }
        for (const [name, progress] of [['walk', 0.3], ['march', 0.3], ['sit', 0.5], ['turn', 0.5], ['wave', 0.4]]) {
          const t = dressed[name](); t.progress(progress); dressed.apDung();
          if (xau(dressed.svg)) hong(id, `${name}: bad attribute values with skirt / held items`);
          t.kill(); dressed.reset();
        }
        const standing = hem.getBoundingClientRect().height; dressed.state.seat = 1; dressed.render();
        if (!(hem.getBoundingClientRect().height < standing * 0.8)) hong(id, 'the skirt does not shorten when seated');
        dressed.reset(); dressed.state.itemR = 0; dressed.render();
        if (dressed.svg.querySelector('[id$="-itemR"]').getAttribute('opacity') !== '0') hong(id, 'state.itemR = 0 does not hide the held item');
        if (trungId(dressed.svg).length) hong(id, 'duplicate ids: ' + trungId(dressed.svg).join(', '));
        dressed.svg.remove();
      }
    }
    // Hói: không còn tóc phía sau khi quay.
    L.registerCharacter({ id: 'check_tmp_4', base: 'surgeon', define: (base) => ({ ...base, hat: () => '', backHair: 'none' }) });
    const bald = L.createCharacter(document.getElementById('san'), { id: 'check_tmp_4' }).rig; bald.state.facing = 1; bald.render();
    if (bald.el.tocGayP.getAttribute('d') !== '' || bald.el.tocLungE.getAttribute('fill') !== bald.mau.da) hong('backHair', "backHair: 'none' still draws hair behind the head");
  }

  // ── LƯỢC ĐỒ CÔNG KHAI: tên tiếng Anh phải tới được đúng chỗ trong rig ──
  { const host = document.getElementById('san');
    L.registerCharacter({ id: 'check_tmp_2', base: 'surgeon', define: (base, kit) => ({
      ...base, name: 'kiểm', hat: () => '', headSize: 1.11, longSleeves: true,
      colors: { ...base.colors, hair: '#888888', top: '#123456' },
      restPose: { upperArmL: 33, smile: 0.5, handL: 'fist' },
      faceExtras: (p, c) => kit.parts.roundGlasses(c), beard: (p, c) => kit.parts.shortBeard(c),
      hair: (p, c) => `<g id="${p}-hair-front" fill="${c.hair}"><circle r="40"/></g>`,
    }) });
    const rig = L.createCharacter(host, { id: 'check_tmp_2' }).rig;
    const expect = (label, got, want) => { if (got !== want) hong('schema', `${label}: got ${JSON.stringify(got)}, expected ${JSON.stringify(want)}`); };
    expect('headSize → coDau', rig.nv.coDau, 1.11);
    expect('longSleeves → tayDai', rig.nv.tayDai, true);
    expect('colors.top → mau.ao', rig.mau.ao, '#123456');
    expect('bí danh màu c.hair', rig.mau.hair, '#888888');
    expect('restPose.upperArmL → NGHI.batL', rig.NGHI.batL, 33);
    expect('restPose.handL fist → nam', rig.NGHI.tayL, 'nam');
    expect('id hair-front → tocTruoc', !!rig.el.tocTruoc, true);
    expect('slot beard được vẽ', rig.svg.querySelector('#' + rig.id + '-beard').children.length > 0, true);
    expect('state.smile đọc', rig.state.smile, 0.5);
    rig.state.upperArmR = 77; expect('state.upperArmR ghi → s.batR', rig.s.batR, 77);
    rig.setColors({ top: '#654321' }); expect('setColors({top})', rig.mau.ao, '#654321');
    expect('partsOf("doctor").faceExtras là hàm', typeof L.kit.partsOf('doctor').faceExtras, 'function');
    for (const name of L.list().expressions) {
      const t = rig.express(name, 1); t.progress(0.5); rig.render();
      if (xau(rig.svg)) hong('express', `${name}: bad attribute values`);
      t.progress(1); for (const key of ['smile', 'browL', 'eyeClose', 'headTilt', 'mouthOpen'].filter((k) => k in rig.state)) if (Math.abs(rig.state[key] - rig.NGHI[S.PERSON_STATE_KEYS[key]]) > 1e-3) hong('express', `${name} does not return ${key} to rest`);
      t.kill(); rig.reset();
    }
    if (L.list().expressions.length < 9) hong('express', 'expected at least nine expressions');
    // GIỌNG ĐIỆU: nói bằng nét mặt buồn thì khoé miệng trễ xuống suốt câu; không khai thì vẫn tươi; xong thì về nghỉ.
    const lineCues = { metadata: { duration: 2 }, mouthCues: [{ start: 0, end: 0.6, value: 'C' }, { start: 0.6, end: 1.2, value: 'D' }, { start: 1.2, end: 2, value: 'B' }] };
    for (const [label, build] of [['speak', (mood) => rig.speak('xin chao ban nhe', 2, { mood })], ['explain', (mood) => rig.explain('xin chao ban nhe', 2, { mood })], ['speakCues', (mood) => rig.speakCues(lineCues, null, { mood })]]) {
      const plain = build(null); let low = Infinity; for (let p = 0.2; p <= 0.7; p += 0.05) { plain.progress(p); low = Math.min(low, rig.state.smile); }
      if (low < 0) hong(label, `without a mood the mouth corners drop (${low.toFixed(2)})`);
      plain.kill(); rig.reset();
      const sad = build('sad'); let high = -Infinity; for (let p = 0.2; p <= 0.7; p += 0.05) { sad.progress(p); high = Math.max(high, rig.state.smile); }
      if (high > -0.2) hong(label, `with mood "sad" the mouth corners stay up (highest ${high.toFixed(2)})`);
      sad.progress(0.4); if (Math.abs(rig.state.browL - 0.75) > 0.05) hong(label, `with mood "sad" the brows are at ${rig.state.browL}, expected 0.75`);
      sad.progress(1); if (Math.abs(rig.state.smile - rig.NGHI.cuoi) > 1e-3 || Math.abs(rig.state.browL - rig.NGHI.mayL) > 1e-3) hong(label, 'a line spoken with a mood does not return the face to rest');
      sad.kill(); rig.reset();
    }
    try { rig.speak('x', 1, { mood: 'joyful' }); hong('speak', 'an unknown mood should throw'); } catch (error) { /* đúng */ }
    // Thú: hình dáng + giống
    const pet = L.createPet(document.getElementById('san2'), { species: 'shiba', config: { shape: { legLength: 0.7, headSize: 1.2 }, colors: { fur: '#445566' } } }).rig;
    expect('pet shape.legLength', pet.shape.legLength, 0.7);
    expect('pet colors.fur → mau.long', pet.mau.long, '#445566');
    if (xau(pet.svg)) hong('schema', 'pet has broken attributes after applying a shape');
  }

  // ── Tư thế nghỉ LỆCH hai tay (một tay cầm đồ) phải sống sót qua bộ số của studio ──
  {
    const host = document.getElementById('san');
    const plain = L.createCharacter(host, { id: 'barista', config: null }).rig;
    const gap = plain.state.upperArmL - plain.state.upperArmR, bend = plain.state.forearmL - plain.state.forearmR;
    const tuned = L.createCharacter(host, { id: 'barista', config: { arms: { restUpperArm: 30, restForearm: -60 } } }).rig;
    if (Math.abs(tuned.state.upperArmR - 30) > 1e-6 || Math.abs(tuned.state.forearmR + 60) > 1e-6) hong('config arms', 'restUpperArm / restForearm do not set the right arm');
    if (Math.abs(tuned.state.upperArmL - tuned.state.upperArmR - gap) > 1e-6 || Math.abs(tuned.state.forearmL - tuned.state.forearmR - bend) > 1e-6)
      hong('config arms', 'a config with rest arm angles flattens a character whose two arms rest differently');
    if (!gap && !bend) hong('barista', 'expected a one-armed rest pose to test with');
    plain.svg.remove(); tuned.svg.remove();
  }

  // ── Tay đang cầm đồ: không xoè ra dưới đồ vật; động tác một tay tự dùng tay rảnh ──
  {
    const host = document.getElementById('san');
    const holder = L.createCharacter(host, { id: 'barista', config: null }).rig;           // cốc ở tay phải
    const shown = (side) => [...holder.svg.querySelectorAll(`[id$="-tay${side}"] > [data-tay]`)].filter((el) => el.getAttribute('opacity') === '1').map((el) => el.dataset.tay).join();
    const rest = { L: holder.state.upperArmL, R: holder.state.upperArmR };
    for (const name of ['wave', 'thumbsUp']) {
      const t = holder[name](); t.progress(0.45); holder.render();
      if (Math.abs(holder.state.upperArmR - rest.R) > 1 || Math.abs(holder.state.upperArmL - rest.L) < 5) hong(name, 'uses the hand that holds an item although the other hand is free');
      t.kill(); holder.reset();
    }
    for (const name of ['present', 'shrug', 'explain']) {
      const t = holder[name](); t.progress(0.45); holder.render();
      if (shown('R') !== 'nam') hong(name, `the hand holding an item opens (shape ${shown('R')})`);
      t.kill(); holder.reset();
    }
    const stowed = holder.hideItem('R'); stowed.progress(1); const wave = holder.wave(); wave.progress(0.45); holder.render();
    if (Math.abs(holder.state.upperArmR - rest.R) < 5) hong('wave', 'does not go back to the right hand once the item is put away');
    wave.kill(); stowed.kill(); holder.svg.remove();
    // Bắt đầu cảnh ĐÃ NGỒI SẴN, đã quay sẵn: đặt trạng thái trước khi dựng sequence, và nó giữ suốt.
    {
      const seated = L.createCharacter(host, { id: 'granny' }).rig;
      seated.state.seat = 1; seated.state.facing = -0.55;
      const line = L.sequence(seated, [['speak', 'xin chao', 1], ['nod']]);
      for (const time of [0, 0.9, line.duration()]) { line.time(time); if (Math.abs(seated.state.seat - 1) > 1e-3) hong('initial stance', `seat set before sequence() is ${seated.state.seat} at ${time}s`); }
      if (Math.abs(seated.state.facing + 0.55) > 1e-3) hong('initial stance', 'facing set before sequence() is not kept at the end');
      line.time(0.9); if (Math.abs(seated.state.facing) > L.RigSVG.GESTURE_TURN + 1e-3) hong('speak', 'the body does not open toward the viewer for the gesture while turned');
      line.kill(); seated.svg.remove();
    }
    // Hai tay đều cầm đồ: vẫy / tán thành bằng ĐẦU, hai tay đứng yên, thời lượng không đổi.
    {
      L.registerCharacter({ id: 'check_tmp_full', base: 'clerk', define: (base, kit) => ({ ...base, heldItemR: (p, c) => kit.parts.phone(c), restPose: { ...base.restPose, handR: 'fist' } }) });
      const full = L.createCharacter(host, { id: 'check_tmp_full' }).rig, free = L.createCharacter(host, { id: 'clerk' }).rig;
      for (const name of ['wave', 'thumbsUp']) {
        const t = full[name](), reference = free[name](); t.progress(0.45); full.render();
        if (Math.abs(full.state.upperArmL - full.NGHI.batL) > 1 || Math.abs(full.state.upperArmR - full.NGHI.batR) > 1) hong(name, 'moves an arm although both hands hold items');
        if (Math.abs(full.state.headTilt - full.NGHI.dau) < 2) hong(name, 'with both hands full there is no head gesture either');
        if (Math.abs(t.duration() - reference.duration()) > 1e-6) hong(name, `the hands-full version lasts ${t.duration()}s instead of ${reference.duration()}s`);
        t.kill(); reference.kill(); full.reset();
      }
      const chosen = full.wave('R'); chosen.progress(0.45);
      if (Math.abs(full.state.upperArmR - full.NGHI.batR) < 5) hong('wave', "wave('R') must use that hand even when both are full");
      chosen.kill(); full.svg.remove(); free.svg.remove();
    }
    // CỬ CHỈ KHI NÓI: tay đi từ tư thế nghỉ của chính nhân vật — không giật trong một khung hình ở đầu câu, không
    // quất nhanh quá 20° mỗi khung; tay đang cầm đồ đứng yên; tay kia có diễn.
    {
      // Ba cụm lời cách nhau hai quãng ngắt; trong mỗi cụm khẩu hình đổi mỗi 0,3 s và cứ ba âm thì một âm mở to (D) — trọng âm.
      const gestureCues = { metadata: { duration: 9 }, mouthCues: [] };
      for (const [from, to] of [[0, 2.7], [3.1, 5.8], [6.2, 9]]) {
        for (let at = from, n = 0; at < to - 1e-6; at += 0.3, n++) gestureCues.mouthCues.push({ start: +at.toFixed(2), end: +Math.min(to, at + 0.3).toFixed(2), value: n % 3 === 1 ? 'D' : n % 3 ? 'B' : 'C' });
        if (to < 9) gestureCues.mouthCues.push({ start: to, end: +(to + 0.4).toFixed(2), value: 'X' });
      }
      const arms = ['upperArmL', 'forearmL', 'upperArmR', 'forearmR'];
      for (const id of ['boy', 'vet', 'clerk', 'barista']) for (const [label, step] of [['speakCues', ['speakCues', gestureCues]], ['explain', ['explain', 'mot hai ba bon nam sau bay tam chin muoi muoi mot muoi hai', 6]]]) {
        L.seed(11); const actor = L.createCharacter(host, { id }).rig, rest = Object.fromEntries(arms.map((k) => [k, actor.state[k]]));
        const line = L.sequence(actor, [['idle', 0.5], step]), begin = line.data.steps[1].start;
        let previous = null, biggest = 0, when = 0, moved = { L: 0, R: 0 };
        for (let time = 0; time <= line.duration(); time += 1 / 60) {
          line.time(time); const now = arms.map((k) => actor.state[k]);
          if (previous) now.forEach((value, n) => { const jump = Math.abs(value - previous[n]); if (jump > biggest) { biggest = jump; when = time; } });
          arms.forEach((k) => { moved[k.slice(-1)] = Math.max(moved[k.slice(-1)], Math.abs(actor.state[k] - rest[k])); });
          previous = now;
        }
        if (biggest > 20) hong(`${label} gestures`, `${id}: an arm joint moves ${biggest.toFixed(0)}° in one frame at ${(when - begin).toFixed(2)}s into the line`);
        line.time(begin + 0.05); const off = Math.max(...arms.map((k) => Math.abs(actor.state[k] - rest[k])));
        if (off > 8) hong(`${label} gestures`, `${id}: the arms are ${off.toFixed(0)}° away from the character's rest pose right as the line starts`);
        for (const side of ['L', 'R']) if (actor.holds[side] && moved[side] > 1.5) hong(`${label} gestures`, `${id}: the arm holding an item moves ${moved[side].toFixed(0)}°`);
        const free = ['L', 'R'].filter((side) => !actor.holds[side]);
        if (label === 'speakCues' && !free.some((side) => moved[side] > 25)) hong(`${label} gestures`, `${id}: no arm gesture during a nine-second line`);
        // Nhịp nhỏ theo trọng âm: cẳng tay của tay rảnh đổi chiều nhiều lần hơn hẳn số cử chỉ lớn (mỗi cử chỉ ~2 lần).
        let flips = 0, direction = 0, before = null;
        for (let time = begin; time <= line.duration(); time += 1 / 60) { line.time(time); const value = actor.state['forearm' + (free[0] || 'R')];
          if (before !== null) { const d = Math.sign(Math.round((value - before) * 40)); if (d && d !== direction) { if (direction) flips++; direction = d; } } before = value; }
        if (label === 'speakCues' && free.length && flips < 6) hong(`${label} gestures`, `${id}: only ${flips} changes of direction in the free forearm — no stress beats`);
        line.kill(); actor.svg.remove();
      }
    }
    // Câu nói ngắn vẫn phải THẤY cử chỉ, với mọi hạt giống: nhân vật nghỉ ở dáng đan tay từng bốc trúng dáng "tay lên
    // ngực" (lệch 15°) và đứng im cả câu.
    for (let seedNo = 1; seedNo <= 8; seedNo++) {
      L.seed(seedNo); const actor = L.createCharacter(host, { id: 'vet' }).rig, rest = actor.state.forearmR;
      const line = L.sequence(actor, [['explain', 'Xin chào các bạn, hôm nay mình khám định kỳ cho bé nhé.', 4]]); let moved = 0;
      for (let time = 0; time <= line.duration(); time += 1 / 30) { line.time(time); moved = Math.max(moved, Math.abs(actor.state.forearmR - rest)); }
      if (moved < 40) hong('explain gestures', `seed ${seedNo}: the forearm moves only ${moved.toFixed(0)}° in a four-second line`);
      line.kill(); actor.svg.remove();
    }
    // Đang quay mặt sang trái thì vẫy và diễn bằng tay TRÁI (tay ở phía người đối diện); quay phải thì tay phải.
    for (const [facing, near, far] of [['left', 'L', 'R'], ['right', 'R', 'L']]) for (const step of ['wave', ['explain', 'mot hai ba bon nam sau bay tam', 4]]) {
      L.seed(5); const actor = L.createCharacter(host, { id: 'boy' }).rig, rest = { L: actor.state.forearmL, R: actor.state.forearmR };
      const line = L.sequence(actor, [['face', facing], step]), begin = line.data.steps[1].start, moved = { L: 0, R: 0 };
      for (let time = begin; time <= line.duration(); time += 1 / 30) { line.time(time); for (const side of ['L', 'R']) moved[side] = Math.max(moved[side], Math.abs(actor.state['forearm' + side] - rest[side])); }
      if (moved[near] < 30 || moved[near] <= moved[far]) hong('facing gestures', `${Array.isArray(step) ? step[0] : step} while facing ${facing}: arm ${near} moves ${moved[near].toFixed(0)}°, arm ${far} ${moved[far].toFixed(0)}°`);
      line.kill(); actor.svg.remove();
    }
    // Cất đồ rồi thì tay buông lỏng (không nắm vào không khí); lấy ra lại thì về dáng giữ đồ. Đi thì tay cầm đồ gần như không vung.
    {
      const actor = L.createCharacter(host, { id: 'barista' }).rig, side = actor.holds.R ? 'R' : 'L', hold = actor.NGHI['cang' + side];
      const line = L.sequence(actor, [['hideItem', side], ['idle', 0.5], ['showItem', side], ['walk', 4, 120]]), steps = line.data.steps;
      line.time(steps[1].start + 0.3);
      if (Math.abs(actor.s['cang' + side] - RigSVG.NGHI['cang' + side]) > 1 || actor.s['tay' + side] !== 'mo') hong('hideItem', `the empty hand keeps its holding pose (forearm ${actor.s['cang' + side].toFixed(0)}°, hand ${actor.s['tay' + side]})`);
      line.time(steps[3].start - 0.01);
      if (Math.abs(actor.s['cang' + side] - hold) > 1) hong('showItem', 'the arm does not come back to its holding pose');
      let swing = 0, other = 0, away = side === 'R' ? 'L' : 'R';
      for (let time = steps[3].start; time <= line.duration(); time += 1 / 30) { line.time(time); swing = Math.max(swing, Math.abs(actor.s['vung' + side])); other = Math.max(other, Math.abs(actor.s['vung' + away])); }
      if (!(swing < other * 0.25)) hong('walk', `the arm holding an item swings (${swing.toFixed(2)} against ${other.toFixed(2)} for the free arm)`);
      line.kill(); actor.svg.remove();
    }
    // Vừa `exit` xong mà `enter` lại: phải THẤY nhân vật suốt quãng đi vào (từng đi vào trong vô hình rồi hiện phụt ra ở giữa).
    for (const make of [() => L.createCharacter(host, { id: 'vet' }).rig, () => L.createPet(host, { species: 'cat' }).rig]) {
      const actor = make(), line = L.sequence(actor, ['exit', 'enter']), back = line.data.steps[1];
      line.time(back.start + back.duration * 0.4);
      if (actor.s.mo < 0.99) hong('enter', `${actor.id || 'pet'}: still invisible (opacity ${actor.s.mo.toFixed(2)}) 40% into walking back in`);
      if (Math.abs(actor.s.x) < 60) hong('enter', 'already at centre 40% into the walk');
      line.kill(); actor.svg.remove();
    }
    // Ba kiểu bước tại chỗ phải KHÁC nhau khi nhìn thẳng: march đánh cẳng tay cao, stroll đung đưa nhẹ và chậm hơn, stepInPlace không đánh tay.
    {
      const actor = L.createCharacter(host, { id: 'boy' }).rig, swing = {}, length = {};
      for (const name of ['march', 'stroll', 'stepInPlace']) {
        const t = actor[name](), rest = actor.NGHI.cangL; let most = 0;
        for (let time = 0; time <= t.duration(); time += 1 / 30) { t.time(time); most = Math.max(most, Math.abs(actor.s.cangL - rest)); }
        swing[name] = most; length[name] = t.duration(); t.kill(); actor.reset();
      }
      if (!(swing.march > 45 && swing.stroll > 1 && swing.stroll < swing.march / 2 && swing.stepInPlace < 1)) hong('steps in place', `forearm swing march ${swing.march.toFixed(0)}°, stroll ${swing.stroll.toFixed(0)}°, stepInPlace ${swing.stepInPlace.toFixed(0)}° — they should differ`);
      if (!(length.stroll > length.march + 0.5)) hong('steps in place', 'stroll is not slower than march');
      actor.svg.remove();
    }
    // Biểu cảm có THÂN NGƯỜI: ngạc nhiên bung tay, suy nghĩ đưa tay lên, vui thì nhún (đang ngồi thì không); tay cầm đồ đứng yên.
    {
      const actor = L.createCharacter(host, { id: 'boy' }).rig, holder = L.createCharacter(host, { id: 'barista' }).rig;
      const most = (rig, name, key, rest) => { const t = rig.express(name); let far = 0; for (let time = 0; time <= t.duration(); time += 1 / 30) { t.time(time); far = Math.max(far, Math.abs(rig.s[key] - rest)); } t.progress(1); const back = Math.abs(rig.s[key] - rest); t.kill(); rig.reset(); return [far, back]; };
      for (const [name, key, least] of [['surprised', 'cangL', 25], ['thinking', 'cangR', 60], ['happy', 'y', 5], ['tired', 'tho', 0.8]]) {
        const [far, back] = most(actor, name, key, actor.NGHI[key]);
        if (far < least) hong('express', `${name}: the body does not join in (${key} moves ${far.toFixed(1)})`);
        if (back > 0.01) hong('express', `${name}: ${key} does not return to rest`);
      }
      actor.s.seat = 1; const t = actor.express('happy'); let lift = 0; for (let p = 0; p <= 1; p += 0.02) { t.progress(p); lift = Math.min(lift, actor.s.y); } t.kill();
      if (lift < -0.5) hong('express', 'a seated character hops when happy');
      const side = holder.holds.R ? 'R' : 'L';
      for (const name of ['surprised', 'thinking', 'angry', 'tired']) { const [far] = most(holder, name, 'cang' + side, holder.NGHI['cang' + side]); if (far > 1) hong('express', `${name}: the arm holding an item moves ${far.toFixed(0)}°`); }
      actor.svg.remove(); holder.svg.remove();
    }
    // Mèo nghỉ ở dáng NGỒI: chạy vào khung thì phải đứng (từng trượt vào trong dáng ngồi).
    {
      const pet = L.createPet(host, { species: 'cat' }).rig, line = L.sequence(pet, ['exit', 'enter']), back = line.data.steps[1];
      line.time(back.start + back.duration * 0.4);
      if (pet.s.ngoi > 0.05) hong('pet enter', `the cat runs in sitting (seat ${pet.s.ngoi.toFixed(2)})`);
      line.kill(); pet.svg.remove();
    }
    // Câu nói 4 giây: nửa SAU câu tay vẫn phải diễn (cử chỉ cuối từng bị bỏ vì không đủ chỗ cho pha về nền).
    {
      let quiet = 0;
      for (let seedNo = 1; seedNo <= 8; seedNo++) {
        L.seed(seedNo); const actor = L.createCharacter(host, { id: 'vet' }).rig, rest = actor.state.forearmR;
        const line = L.sequence(actor, [['explain', 'Xin chào các bạn, hôm nay mình khám định kỳ cho bé nhé.', 4]]); let late = 0, biggest = 0, before = null;
        for (let time = 0; time <= line.duration(); time += 1 / 60) { line.time(time); const now = actor.state.forearmR; if (time > 2.4 && time < 4) late = Math.max(late, Math.abs(now - rest)); if (before !== null) biggest = Math.max(biggest, Math.abs(now - before)); before = now; }
        if (late < 30) quiet++;
        if (biggest > 20) hong('explain gestures', `seed ${seedNo}: the forearm jumps ${biggest.toFixed(0)}° in one frame`);
        line.time(line.duration()); if (Math.abs(actor.state.forearmR - rest) > 0.5) hong('explain gestures', `seed ${seedNo}: the arm does not return to rest after the line`);
        line.kill(); actor.svg.remove();
      }
      if (quiet) hong('explain gestures', `${quiet} of 8 seeds: no gesture in the second half of a four-second line`);
    }
    // Đồ cầm LUÔN ĐỨNG THẲNG trên màn hình: lúc nghỉ, lúc đi ngang cả hai chiều, lúc quay mặt.
    {
      const actor = L.createCharacter(host, { id: 'barista' }).rig, side = actor.holds.R ? 'R' : 'L', upright = -90;       // −90° là nắp cốc hướng LÊN, cho cả hai tay
      const tilt = () => { actor.render(); const m = actor.el['item' + side].getScreenCTM(); let off = Math.atan2(m.b, m.a) * 180 / Math.PI - upright; off = ((off + 540) % 360) - 180; return Math.abs(off); };
      const poses = [['at rest', null, 0], ['walking right', ['walk', 4, 120], 0.5], ['walking left', ['walk', 4, -120], 0.5], ['facing left', ['face', 'left'], 1], ['waving', ['wave'], 0.5]];
      for (const [label, step, progress] of poses) {
        const t = step ? actor[step[0]](...step.slice(1)) : null; if (t) t.progress(progress);
        const off = tilt(); if (off > 8) hong('held item', `${label}: the item is tilted ${off.toFixed(0)}° from upright`);
        if (t) t.kill(); actor.reset();
      }
      actor.svg.remove();
    }

      const pet = L.createPet(host, { species: 'dog' }).rig;
      const line = L.sequence(pet, [['walk', 4, 60], ['face', 'left'], to ? ['exit', to] : 'exit']), last = line.data.steps[2];

      line.time(last.start + last.duration / 2);
      if (Math.sign(pet.s.huong) !== dir) hong('pet exit', `runs ${dir > 0 ? 'right' : 'left'} while facing the other way`);
      if ((pet.s.x - from) * dir <= 0) hong('pet exit', `does not move ${dir > 0 ? 'right' : 'left'}`);
      if (Math.abs(from - 60) > 2) hong('pet exit', `starts from x ${from.toFixed(0)} instead of where the pet stands (60)`);

    // Vẫy tay: không quất (dưới 20° mỗi khung, kể cả từ dáng đan tay), biên độ nhỏ dần, dài đúng 2,25 s.
    for (const id of ['vet', 'boy']) {
      const waver = L.createCharacter(host, { id }).rig, t = waver.wave(); let before = null, biggest = 0; const peaks = [];
      for (let time = 0; time <= t.duration(); time += 1 / 60) { t.time(time); const now = [waver.state.upperArmR, waver.state.forearmR]; if (before) biggest = Math.max(biggest, Math.abs(now[0] - before[0]), Math.abs(now[1] - before[1])); before = now; }

    { const waits = L.conversation([[a, ['speak', 'mot', 1]], [b, ['speak', 'hai', 1]]], { overlap: false }).turns; if (Math.abs(waits[1].start - waits[0].end - 0.25) > 0.01) hong('conversation', 'overlap: false must wait for the whole previous turn'); a.reset(); b.reset(); b.state.seat = 1;
      const twice = L.conversation([[a, ['speak', 'mot', 1]], [a, ['speak', 'hai', 1]]]).turns; if (twice[1].start < twice[0].end) hong('conversation', 'one character speaking two turns in a row overlaps itself'); a.reset(); }

    const scene = ['#tk-wall', '#tk-a', '#tk-b', '#tk-dog'], when = turns[3].start + 0.5;
    const inFrame = (rig, kind) => { const frame = stage.getBoundingClientRect(), svg = rig.svg.getBoundingClientRect(), size = rig.constructor.KHUNG, unit = svg.height / size.h, left = svg.left + (svg.width - size.w * unit) / 2, box = rig.shotBox(kind);
      return left + box.x * unit >= frame.left - 2 && left + (box.x + box.width) * unit <= frame.right + 2 && svg.top + box.y * unit >= frame.top - 2 && svg.top + (box.y + box.height) * unit <= frame.bottom + 2; };
    for (const [subjects, kind] of [[[a, b], 'chest'], [[a, dog], 'full'], [[dog], 'face'], [[a, b, dog], 'full']]) {
      const push = L.shot(scene, subjects, kind, { time: when }); push.progress(1);
      for (const rig of subjects) { rig.lastSequence.time(when); if (!inFrame(rig, kind)) hong('shot', `${kind} of ${subjects.length} subject(s): "${rig.publicId}" is not fully inside the frame`); }
      if (subjects.length === 1 && push.data.target.scale < 1.5) hong('shot', `a ${kind} shot of the dog barely zooms (scale ${push.data.target.scale.toFixed(2)})`);
      push.kill();
    }
    L.shot(scene, null, 'wide').progress(1);
    if (!stage.querySelector('#tk-wall').hasAttribute('data-layout-allow-overflow')) hong('shot', 'zoomed scene elements are not marked data-layout-allow-overflow (hyperframes check will warn)');

    // Phụ đề: đúng lời, đúng lúc; tắt giữa hai câu; tua ngược vẫn đúng.
    const caption = document.createElement('div'); caption.style.cssText = 'position:absolute;left:0;top:0'; caption.innerHTML = '<b data-caption-text></b>'; stage.appendChild(caption);
    const words = L.captions(talk, caption), slot = caption.querySelector('[data-caption-text]');
    const lineA = turns[2].steps[0], lineB = turns[3].steps[0];
    if (lineA.text !== 'xin chao ba' || Math.abs(lineA.speech - 2) > 0.01) hong('captions', `the explain step carries text ${JSON.stringify(lineA.text)} and speech ${lineA.speech}, expected "xin chao ba" and 2`);
    words.time(lineA.start + 1); if (slot.textContent !== 'xin chao ba' || +caption.style.opacity < 0.99) hong('captions', `during the first line the caption shows ${JSON.stringify(slot.textContent)} at opacity ${caption.style.opacity}`);
    words.time(lineB.start + 0.6); if (slot.textContent !== 'chao chau' || +caption.style.opacity < 0.99) hong('captions', `during the second line the caption shows ${JSON.stringify(slot.textContent)}`);
    words.time(lineA.start + 1); if (slot.textContent !== 'xin chao ba') hong('captions', 'seeking backwards does not restore the earlier line');
    words.time(lineA.start - 1); if (+caption.style.opacity > 0.01) hong('captions', 'the caption is visible before anyone speaks');
    words.time(words.duration()); if (+caption.style.opacity > 0.01) hong('captions', 'the caption is still visible at the end');
    if (words.data.lines.length !== 2) hong('captions', `expected 2 lines, got ${words.data.lines.length}`);
    // Chia cụm: câu dài tách ở cuối câu, các cụm nối tiếp nhau và phủ đúng quãng của câu gốc.
    const long = [{ start: 1, end: 9, text: 'Mot: mang theo so tiem chung. Hai: cho be nhin an bon tieng truoc khi kham. Ba: ghi lai nhung thay doi ban thay o be.' }];
    const chunked = L.captions(long, caption, { maxChars: 60, readable: false }).data.lines;
    if (chunked.length < 2) hong('captions', 'maxChars does not split a long line');
    else {
      if (chunked.some((line) => line.text.length > 61)) hong('captions', 'a chunk is longer than maxChars');
      if (chunked.some((line) => /:$/.test(line.text))) hong('captions', `a chunk ends on a colon: ${JSON.stringify(chunked.map((line) => line.text))}`);
      if (Math.abs(chunked[0].start - 1) > 1e-6 || Math.abs(chunked[chunked.length - 1].end - 9) > 1e-6 || chunked.some((line, i) => i && Math.abs(line.start - chunked[i - 1].end) > 1e-6)) hong('captions', 'chunks do not tile the original line');
      if (chunked.map((line) => line.text).join(' ') !== long[0].text) hong('captions', 'chunks lose or reorder words');
    }
    if (L.captions(long, caption, { readable: false }).data.lines.length !== 1) hong('captions', 'without maxChars a line must stay whole');
    // Chỗ ngắt: rơi vào dấu câu khi có (kể cả khi cụm ngắn), và không nhồi đầy dòng để lại một cụm cuối vài chữ.
    {
      const cut = (text) => L.captions([{ start: 0, end: 8, text }], caption, { maxChars: 52, readable: false }).data.lines.map((line) => line.text);
      const clauses = cut('Dạ, em mới nhận nuôi một bé mèo vàng, bé còn nhát lắm, cứ trốn dưới gầm giường suốt cả ngày, em không biết phải làm sao cho bé quen.');
      if (clauses.some((piece) => !/[.,]$/.test(piece))) hong('captions', `a chunk breaks in the middle of a clause although a comma was within reach: ${JSON.stringify(clauses)}`);
      const plain = cut('Một câu không có dấu câu nào hết mà lại dài hơn một dòng chữ một chút thôi nhé');
      if (plain.length !== 2 || Math.min(...plain.map((piece) => piece.length)) < 30) hong('captions', `a sentence without punctuation is not split evenly: ${JSON.stringify(plain)}`);
    }
    // Lời của speakCues lấy từ { text } hoặc từ metadata của bộ cue.
    const cued = L.sequence(a, [['speakCues', { metadata: { duration: 1, text: 'tu metadata' }, mouthCues: [{ start: 0, end: 1, value: 'C' }] }], ['speakCues', { mouthCues: [{ start: 0, end: 1, value: 'C' }] }, null, { text: 'tu tuy chon' }]]);
    if (cued.data.steps[0].text !== 'tu metadata' || cued.data.steps[1].text !== 'tu tuy chon') hong('captions', `speakCues text is not picked up (${cued.data.steps.map((step) => step.text)})`);
    if (!Array.isArray(cued.data.steps[0].cues) || cued.data.steps[0].cues.length !== 1) hong('sequence', 'speakCues steps do not carry their cues (tools/peek.sh --mouth needs them)');
    cued.kill();
    try { L.captions(L.sequence(a, ['wave', 'nod']), caption); hong('captions', 'a source without spoken text should throw'); } catch (error) { /* đúng */ }
    // Bong bóng: nằm phía trên đầu người nói, và đổi chỗ khi đổi người nói.
    const bubble = document.createElement('div'); bubble.style.cssText = 'position:absolute;width:200px;height:60px'; stage.appendChild(bubble);
    const said = L.captions(talk, bubble, { follow: true });
    const over = (rig, time) => { said.time(time); rig.lastSequence.time(time); const head = rig.el.dau.getBoundingClientRect(), box = bubble.getBoundingClientRect();
      return Math.abs((box.left + box.right) / 2 - (head.left + head.right) / 2) < 60 && box.bottom <= head.top + 30; };
    if (!over(a, lineA.start + 1)) hong('captions', 'follow: the bubble is not above the first speaker');
    if (!over(b, lineB.start + 0.6)) hong('captions', 'follow: the bubble does not move to the second speaker');
    caption.remove(); bubble.remove();

    // Máy quay tự động: cắt vào người đang nói, về toàn cảnh sau câu cuối; lượt có `shot` thì theo lượt ấy.
    a.reset(); b.reset(); b.state.seat = 1;
    const directed = L.conversation([
      [a, ['face', b]],
      [a, ['explain', 'mot', 1.5]],
      [b, ['speak', 'hai', 1.2]],
      { turn: [a, ['speak', 'ba', 1]], shot: [a, b] },
      { turn: [b, ['speak', 'bon', 1]], shot: false },
    ], { camera: scene });
    const film = gsap.timeline({ paused: true }); directed.addTo(film, 0);
    const wall = stage.querySelector('#tk-wall'), zoom = () => wall.getBoundingClientRect().width / 1920;
    const centred = (rig) => { const frame = stage.getBoundingClientRect(), head = rig.el.dau.getBoundingClientRect(); return Math.abs((head.left + head.right) / 2 - frame.left - 960) < 120; };
    const spoken = directed.turns.filter((turn) => turn.steps.some((step) => step.text)).map((turn) => turn.steps.find((step) => step.text));
    film.time(0.2); if (zoom() > 1.01) hong('camera', 'the camera is zoomed before anyone speaks');
    film.time(spoken[0].start + 1); if (zoom() < 1.3 || !centred(a)) hong('camera', `first line: zoom ${zoom().toFixed(2)}, speaker centred: ${centred(a)}`);
    film.time(spoken[1].start + 0.9); if (zoom() < 1.3 || !centred(b)) hong('camera', `second line: the camera did not cut to the second speaker (zoom ${zoom().toFixed(2)})`);
    film.time(spoken[2].start + 0.8); const two = zoom();
    film.time(spoken[3].start + 0.8); if (Math.abs(zoom() - two) > 1e-3) hong('camera', 'a turn with shot: false must leave the camera where it was');
    if (centred(a) || centred(b)) { /* khung hai người: không ai ở chính giữa — chỉ cần cả hai trong khung */ }
    for (const rig of [a, b]) { const frame = stage.getBoundingClientRect(), head = rig.el.dau.getBoundingClientRect(); if (head.left < frame.left - 2 || head.right > frame.right + 2) hong('camera', `shot: [a, b] does not keep "${rig.publicId}" in frame`); }
    film.time(film.duration()); if (zoom() > 1.01) hong('camera', 'the camera does not return to the wide shot after the last line');
    if (!directed.camera) hong('camera', 'conversation(…, { camera }) does not expose the camera timeline');
    // Lượt có `enter`: máy quay về toàn cảnh khi người ấy bắt đầu bước vào, rồi mới cắt vào khi họ nói.
    {
      a.reset(); b.reset(); b.state.seat = 1;
      const arriving = L.conversation([[b, ['speak', 'mot', 1.2]], [a, 'enter', ['speak', 'hai', 1.2]]], { camera: scene });
      const film2 = gsap.timeline({ paused: true }); arriving.addTo(film2, 0);
      const entry = arriving.turns[1].steps[0], said = arriving.turns[1].steps[1];
      film2.time(entry.start + 0.8); if (zoom() > 1.01) hong('camera', `the camera stays in a close-up (zoom ${zoom().toFixed(2)}) while another character walks in`);
      film2.time(said.start + 0.9); if (zoom() < 1.2) hong('camera', 'the camera does not cut to the newcomer once they speak');
      film2.time(0); a.reset(); b.reset(); b.state.seat = 1;
    }
    // Né người đứng cạnh: cận một người mà đầu người kia bị mép khung cắt ngang thì khung phải dời đi, hoặc ôm cả hai.
    {
      const near = document.createElement('div'); near.style.cssText = 'position:absolute;left:560px;bottom:96px;height:760px'; near.id = 'tk-near'; stage.appendChild(near);
      const c = L.createCharacter(near, { id: 'clerk' }).rig;
      const all = [...scene, '#tk-near'];
      const cut = (rig) => { const frame = stage.getBoundingClientRect(), head = rig.el.dau.getBoundingClientRect(), seen = Math.min(frame.right, head.right) - Math.max(frame.left, head.left); return seen > 0.08 * head.width && seen < 0.92 * head.width; };
      a.reset();
      // Đặt người đứng cạnh sao cho tâm đầu của họ nằm đúng trên mép phải của cảnh cận thường.
      const probe = L.shot(all, a, 'chest'), edge = (1920 - probe.data.target.x) / probe.data.target.scale; probe.kill();
      near.style.left = `${edge - 760 * 400 / 470 / 2}px`;
      const plain = L.shot(all, a, 'chest'); plain.progress(1); const wasCut = cut(c); plain.kill();
      const careful = L.shot(all, a, 'chest', { avoid: [a, b, c, dog] }); careful.progress(1);
      if (!wasCut) hong('shot avoid', 'test setup: the neighbour is not cut by the plain close-up');
      if (cut(c)) hong('shot avoid', 'a neighbour is still cut by the frame edge');
      if (cut(a)) hong('shot avoid', 'avoiding the neighbour cut the subject instead');
      careful.kill(); L.shot(all, null, 'wide').progress(1); c.svg.remove(); near.remove();
    }
    // Lượt không lời: người diễn nằm NGOÀI cảnh cận thì máy quay lùi về toàn cảnh; đang ở trong khung thì đứng yên.
    a.reset(); b.reset(); b.state.seat = 1; dog.datNghi();
    const acted = L.conversation([[a, ['speak', 'mot', 1.2]], [a, 'nod'], [dog, 'bark'], [b, ['speak', 'hai', 1]]], { camera: scene });
    const reel = gsap.timeline({ paused: true }); acted.addTo(reel, 0);
    const nodTurn = acted.turns[1], barkTurn = acted.turns[2];
    reel.time((nodTurn.start + nodTurn.end) / 2); if (zoom() < 1.3) hong('camera', 'the camera leaves the speaker while the same character nods');
    // Lúc chó sủa: hoặc máy quay đã về toàn cảnh, hoặc cảnh đang quay ÔM TRỌN cái đầu con chó (từ 0.30: con vật bị mép
    // khung cắt thì được đưa hẳn vào khung, nên cận cảnh trước đó có thể đã gồm nó).
    reel.time(barkTurn.start + 0.5);
    { const frame = stage.getBoundingClientRect(), head = dog.el.dau.getBoundingClientRect(), whole = head.left >= frame.left - 1 && head.right <= frame.right + 1 && head.top >= frame.top - 1 && head.bottom <= frame.bottom + 1;
      if (zoom() > 1.01 && !whole) hong('camera', `a silent turn by a character outside the close-up is not shown (zoom ${zoom().toFixed(2)} during the dog's bark, its head not wholly in frame)`); }
    reel.time(acted.turns[3].steps[0].start + 0.6); if (zoom() < 1.3) hong('camera', 'the camera does not return to the next speaker after a silent turn');
    reel.time(0);
    // `face(người kia)` trong hội thoại phải nhìn về chỗ người kia ĐANG ĐỨNG, không phải chỗ họ xuất phát:
    // con chó bắt đầu bên PHẢI của a rồi chạy sang bên TRÁI — a phải quay trái, chó phải quay phải.
    a.reset(); b.reset(); dog.datNghi();
    const crossing = L.conversation([[dog, ['walk', 4, -700]], { together: [[a, ['face', dog]], [dog, ['face', a]]] }, [a, 'nod']]);
    crossing.of(a).time(crossing.duration); crossing.of(dog).time(crossing.duration);
    if (!(a.state.facing < 0)) hong('conversation', `face(rig) looks at where the other character started, not where it is now (facing ${a.state.facing})`);
    if (dog.s.huong !== 1) hong('conversation', `a pet's face(rig) inside a conversation turns the wrong way (${dog.s.huong})`);
    const faced = crossing.of(a).data.steps.find((step) => step.name === 'face');
    if (!faced || faced.target !== dog) hong('conversation', 'the face step no longer records the real target (tools/peek.sh needs it)');
    // Cảnh mở đầu bằng lời nói thì chừa một nhịp; mở đầu bằng động tác thì không.
    a.reset();
    const spokenFirst = L.conversation([[a, ['speak', 'xin chao', 1]]]), actedFirst = L.conversation([[a, 'nod'], [a, ['speak', 'xin chao', 1]]]);
    if (Math.abs(spokenFirst.turns[0].start - 0.6) > 0.01) hong('conversation', `an opening line starts at ${spokenFirst.turns[0].start}s instead of after the 0.6 s lead-in`);
    if (Math.abs(actedFirst.turns[0].start) > 0.01) hong('conversation', 'a conversation that opens with an action must start at 0');
    if (Math.abs(L.conversation([[a, ['speak', 'xin chao', 1]]], { leadIn: 0 }).turns[0].start) > 0.01) hong('conversation', 'leadIn: 0 is ignored');
    a.reset();
    // Thú đi quãng dài thì chạy lúp xúp: 600 đơn vị trong dưới 5 giây, vẫn dừng đúng chỗ.
    dog.datNghi(); const trot = L.sequence(dog, [['walk', 4, 600]]); trot.time(trot.duration());
    if (trot.duration() > 5 || Math.abs(dog.s.x - 600) > 1e-3) hong('pet walk', `walk(4, 600) takes ${trot.duration().toFixed(1)}s and ends at x ${dog.s.x}`);
    trot.kill();
    stage.remove();
  }

  // ── Công cụ SOÁT BẰNG MẮT cũng phải chạy: bảng tư thế đủ ô, gallery đủ nhân vật ──
  {
    const load = (url) => new Promise((resolve) => {
      const frame = document.createElement('iframe'); frame.style.cssText = 'position:fixed;left:-3000px;width:1280px;height:1500px'; frame.src = url; document.body.appendChild(frame);
      const started = Date.now();
      const poll = () => { let title = ''; try { title = frame.contentDocument.title; } catch (error) { /* chưa tải xong */ }
        if (title === 'DONE' || Date.now() - started > 8000) resolve({ frame, done: title === 'DONE' }); else setTimeout(poll, 50); };
      poll();
    });
    const cells = (frame) => [...frame.contentDocument.body.children].filter((el) => el.tagName === 'DIV');
    const names = JSON.parse(listAtStart);
    for (const [id, expected] of [['receptionist', 26], ['dog', 2 + RigThu.DONG_TAC.dog.length - 1]]) {
      const { frame, done } = await load(`sheet.html?nv=${id}`);
      if (!done) hong(`sheet.html?nv=${id}`, 'the pose sheet does not finish (script error?)');
      else if (cells(frame).length !== expected) hong(`sheet.html?nv=${id}`, `the pose sheet shows ${cells(frame).length} panels, expected ${expected}`);
      else if (cells(frame).some((el) => !el.querySelector('svg'))) hong(`sheet.html?nv=${id}`, 'a panel is empty');
      frame.remove();
    }
    const { frame, done } = await load('gallery.html'), wanted = Object.keys(names.people).length + Object.keys(names.pets).length;
    if (!done) hong('gallery.html', 'the gallery does not finish (script error?)');
    else if (cells(frame).length !== wanted) hong('gallery.html', `the gallery shows ${cells(frame).length} characters, expected ${wanted}`);
    frame.remove();
  }

  // ── Bản SLIM phải chạy ra cùng kết quả với bản đầy đủ ──
  try {
    const slimSource = await (await fetch('../dist/character.slim.js', { cache: 'no-store' })).text();
    const Slim = new Function(slimSource + '\nreturn VGCharacter;')();
    if (listOf(Slim) !== listAtStart) hong('dist', 'character.slim.js is out of date — run: python3 tools/build.py');
    const a = document.createElement('div'), b = document.createElement('div'); document.body.append(a, b);
    const strip = (svg) => svg.innerHTML.replace(/rig\d+|thu\d+/g, 'ID');
    const markup = (lib, host) => strip(lib.createCharacter(host, { id: 'doctor', config: null }).rig.svg);
    if (markup(Slim, a) !== markup(L, b)) hong('dist', 'the slim bundle renders differently from the full one');
    a.remove(); b.remove();
  } catch (e) { hong('dist', 'the slim bundle does not run: ' + e.message); }

  // Bản dựng IIFE phải tươi: cùng danh sách nhân vật với mã nguồn.
  const G = window[L.GLOBAL_NAME];
  if (!G) hong('dist', 'dist/character.iife.js failed to load — run: python3 tools/build.py');
  else {
    const a = listOf(G), b = listAtStart;
    ra.banDung.khop = a === b;
    if (a !== b) hong('dist', 'dist/character.iife.js is out of date — run: python3 tools/build.py');
    const h = document.createElement('div'); document.body.appendChild(h);
    try { const { rig } = G.createCharacter(h, { id: 'vet', config: { colors: { top: '#2f9e8f' } } }); if (rig.mau.ao !== '#2f9e8f') hong('dist', 'createCharacter ignored the config'); }
    catch (e) { hong('dist', 'createCharacter threw: ' + e.message); }
    h.remove();
  }
} catch (e) { hong('check', e.stack || String(e)); }
document.getElementById('kq').textContent = JSON.stringify(ra);
document.title = ra.ok ? 'PASS' : 'FAIL';
</script>
