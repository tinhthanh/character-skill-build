name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Chrome có sẵn trên runner ubuntu-latest; tools/chrome.sh tự tìm google-chrome.
      - name: Every character × every action
        run: sh tools/check.sh
      - name: dist/ is committed up to date
        run: git diff --exit-code -- dist
      # Hợp đồng HyperFrames: mỗi ví dụ phải qua `hyperframes lint`. Node có sẵn trên runner.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # `hyperframes check` đọc tệp tiếng của ví dụ voiceover bằng ffprobe — runner không có sẵn.
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      # lint (tĩnh) + check (nạp từng ví dụ vào trình duyệt, soát runtime / bố cục / chuyển động).
      - name: Examples pass hyperframes lint and check
        run: sh tools/lint-examples.sh --check
