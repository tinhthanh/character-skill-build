<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HyperFrames example — a conversation in a cafe</title>
<style>
  html, body { margin: 0; background: #0b1218; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: system-ui, sans-serif; }
  #wall { position: absolute; inset: 0; background: linear-gradient(165deg, #46362e 0%, #1b1512 72%); }
  #floor { position: absolute; left: 0; right: 0; bottom: 0; height: 190px; background: #2a201b; }
  /* The chair is a ready-made prop. Same left / bottom / height as the character who sits on it,
     and BEFORE her in the HTML so it is drawn behind her. */
  #chair { position: absolute; left: 1150px; bottom: 96px; height: 700px; }
  #table { position: absolute; left: 1420px; bottom: 96px; height: 700px; }
  /* Give each character a HEIGHT; the width follows the rig's own aspect ratio. */
  /* Captions sit in the frame, outside the scene the camera moves. */
  #caption { position: absolute; left: 50%; bottom: 70px; transform: translateX(-50%); max-width: 1300px; padding: 18px 34px; border-radius: 18px;
             background: rgba(12, 9, 8, 0.78); color: #fff6ea; font: 600 44px/1.25 system-ui, sans-serif; text-align: center; opacity: 0; }
  #barista { position: absolute; left: -60px; bottom: 96px; height: 760px; }   /* near the edge: her entrance starts off-frame */
  #granny { position: absolute; left: 1150px; bottom: 96px; height: 700px; }
</style>
</head>
<body>
<div id="stage" data-composition-id="cafe-conversation" data-start="0" data-duration="21" data-width="1920" data-height="1080">
  <div id="wall" class="clip" data-start="0" data-duration="21" data-track-index="0"></div>
  <div id="floor" class="clip" data-start="0" data-duration="21" data-track-index="1"></div>
  <div id="chair" class="clip" data-start="0" data-duration="21" data-track-index="2"></div>
  <div id="granny" class="clip" data-start="0" data-duration="21" data-track-index="3"></div>
  <div id="table" class="clip" data-start="0" data-duration="21" data-track-index="4"></div>
  <div id="barista" class="clip" data-start="0" data-duration="21" data-track-index="5"></div>
  <div id="caption" class="clip" data-start="0" data-duration="21" data-track-index="6"></div>

  <script src="../../vendor/gsap-3.15.1.min.js"></script>
  <!-- In a real project: copy dist/character.slim.js next to index.html and load that. -->
  <script src="../../dist/character.iife.js"></script>
  <script>
    VGCharacter.seed(11);
    const barista = VGCharacter.createCharacter(document.getElementById('barista'), { id: 'barista' }).rig;
    const granny = VGCharacter.createCharacter(document.getElementById('granny'), { id: 'granny' }).rig;

    // Furniture: `for: granny` sets the seat to the height at which she sits.
    VGCharacter.createProp(document.getElementById('chair'), 'chair', { for: granny, color: '#8a5a3c' });
    VGCharacter.createProp(document.getElementById('table'), 'table', { color: '#a9764f', width: 170, height: 135 });

    // A conversation = TURNS. Each turn is [rig, ...steps]; the next turn starts when the previous
    // one is done, and a character waiting for its turn keeps breathing. No pauses to add up by hand.
    //
    // Stance holds until changed: a seated character plays every action seated, and after
    // `face(other)` every action plays turned toward them (hand gestures open the body to the
    // viewer for a moment, then return).
    //
    // Granny is ALREADY SEATED in the first frame: set the stance on the rig before the
    // conversation is built. (`sitDown` is for sitting down on camera.)
    granny.state.seat = 1;
    const talk = VGCharacter.conversation([
      [barista, ['enter', 'left'], ['walk', 4, 250]],        // from the edge to her mark (frame units)
      { together: [[barista, ['face', granny]], [granny, ['face', barista]]] },
      [barista, ['explain', 'Good morning! One flat white, as always?', 2.6]],
      [granny, ['speak', 'Yes please, dear. And a biscuit.', 2.4], 'nod'],
      [barista, 'nod', ['speak', 'Coming right up.', 1.4]],
      { together: [[barista, ['face', 'front'], 'thumbsUp'],   // her right hand holds the cup, so this uses the left
                   [granny, 'standUp']] },
    ], {
      // The camera cuts to whoever is speaking and returns to the wide shot after the last line.
      camera: { scene: ['#wall', '#floor', '#chair', '#granny', '#table', '#barista'], kind: 'chest' },
    });

    const tl = gsap.timeline({ paused: true });
    talk.addTo(tl, 0);                                  // every character's sequence, and the camera
    // Captions: the words of each speak / explain step, shown while it is spoken.
    tl.add(VGCharacter.captions(talk, document.getElementById('caption')).paused(false), 0);
    window.__timelines = window.__timelines || {};
    window.__timelines['cafe-conversation'] = tl;
  </script>
</div>
</body>
</html>
